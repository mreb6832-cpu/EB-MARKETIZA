<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Products | EB MARKETIZA</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #111827;
    }

    nav {
      background: #111827;
      color: white;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 15px;
    }

    .container {
      max-width: 1200px;
      margin: 30px auto;
      padding: 20px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 25px;
      flex-wrap: wrap;
    }

    .top h1 {
      font-size: 30px;
    }

    .filters {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    input,
    select {
      padding: 11px 13px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      background: white;
      font-size: 15px;
    }

    #resultCount {
      color: #6b7280;
      margin-bottom: 20px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
    }

    .card {
      background: white;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 4px 18px rgba(0,0,0,.07);
      cursor: pointer;
      transition: transform .2s, box-shadow .2s;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(0,0,0,.12);
    }

    .product-image {
      width: 100%;
      height: 230px;
      object-fit: contain;
      background: #f3f4f6;
    }

    .card-body {
      padding: 16px;
    }

    .category {
      display: inline-block;
      background: #e5edff;
      color: #2563eb;
      padding: 5px 9px;
      border-radius: 15px;
      font-size: 12px;
      margin-bottom: 10px;
    }

    .name {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .price {
      color: #2563eb;
      font-size: 19px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .stock {
      color: #6b7280;
      font-size: 14px;
    }

    .empty,
    .error {
      background: white;
      padding: 50px 20px;
      border-radius: 14px;
      text-align: center;
      grid-column: 1 / -1;
    }

    .error {
      color: #dc2626;
    }

    @media (max-width: 1000px) {
      .products {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 700px) {
      .products {
        grid-template-columns: repeat(2, 1fr);
      }

      .product-image {
        height: 190px;
      }

      nav {
        flex-direction: column;
        gap: 12px;
      }
    }

    @media (max-width: 450px) {
      .products {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<nav>

  <div class="logo">
    EB MARKETIZA
  </div>

  <div>
    <a href="index.html">Home</a>
    <a href="products.html">Products</a>
    <a href="cart.html">Cart 🛒</a>
    <a href="account.html">Account</a>
  </div>

</nav>


<div class="container">

  <div class="top">

    <h1>Products</h1>

    <div class="filters">

      <input
        type="search"
        id="productSearch"
        placeholder="Search products..."
      >

      <select id="categoryFilter">

        <option value="">
          All Categories
        </option>

      </select>

    </div>

  </div>


  <div id="resultCount"></div>


  <div
    id="productGrid"
    class="products"
  ></div>

</div>


<script type="module">

import { supabase } from "./supabaseClient.js";


const productGrid =
  document.getElementById("productGrid");

const productSearch =
  document.getElementById("productSearch");

const categoryFilter =
  document.getElementById("categoryFilter");

const resultCount =
  document.getElementById("resultCount");


let products = [];


/* =========================
   LOAD PRODUCTS
========================= */

async function loadProducts() {

  const {
    data,
    error
  } = await supabase
    .from("products")
    .select(`
      id,
      name,
      description,
      price,
      category,
      stock,
      image,
      created_at
    `)
    .order("created_at", {
      ascending: false
    });


  if (error) {

    console.error(error);

    productGrid.innerHTML = `
      <div class="error">
        Could not load products.
        <br><br>
        ${escapeHtml(error.message)}
      </div>
    `;

    resultCount.textContent = "";

    return;
  }


  products = data || [];

  createCategories();

  renderProducts();
}


/* =========================
   CATEGORIES
========================= */

function createCategories() {

  const categories = [
    ...new Set(
      products
        .map(product => product.category)
        .filter(Boolean)
    )
  ].sort();


  categoryFilter.innerHTML = `
    <option value="">
      All Categories
    </option>
  `;


  categories.forEach(category => {

    const option =
      document.createElement("option");

    option.value = category;
    option.textContent = category;

    categoryFilter.appendChild(option);
  });
}


/* =========================
   RENDER PRODUCTS
========================= */

function renderProducts() {

  const search =
    productSearch.value
      .trim()
      .toLowerCase();

  const category =
    categoryFilter.value;


  const filtered =
    products.filter(product => {

      const matchesSearch =
        !search ||
        product.name
          .toLowerCase()
          .includes(search) ||
        (product.description || "")
          .toLowerCase()
          .includes(search);


      const matchesCategory =
        !category ||
        product.category === category;


      return (
        matchesSearch &&
        matchesCategory
      );
    });


  resultCount.textContent =
    `${filtered.length} product${filtered.length === 1 ? "" : "s"}`;


  if (filtered.length === 0) {

    productGrid.innerHTML = `
      <div class="empty">
        <h2>No products found</h2>
        <p>
          Try another search or category.
        </p>
      </div>
    `;

    return;
  }


  productGrid.innerHTML =
    filtered.map(product => {

      const image =
        product.image || "";


      const stock =
        Number(product.stock || 0);


      return `

        <div
          class="card"
          onclick="openProduct(${product.id})"
        >

          <img
            class="product-image"
            src="${escapeHtml(image)}"
            alt="${escapeHtml(product.name)}"
            onerror="this.style.display='none'"
          >


          <div class="card-body">

            ${
              product.category
              ? `
                <span class="category">
                  ${escapeHtml(product.category)}
                </span>
              `
              : ""
            }


            <div class="name">
              ${escapeHtml(product.name)}
            </div>


            <div class="price">
              ${Number(product.price).toFixed(2)} SEK
            </div>


            <div class="stock">
              ${
                stock > 0
                ? `${stock} in stock`
                : "Out of stock"
              }
            </div>

          </div>

        </div>

      `;

    }).join("");
}


/* =========================
   OPEN PRODUCT DETAILS
========================= */

window.openProduct = function(id) {

  window.location.href =
    `product-details.html?id=${encodeURIComponent(id)}`;
};


/* =========================
   SEARCH
========================= */

productSearch.addEventListener(
  "input",
  renderProducts
);


/* =========================
   CATEGORY
========================= */

categoryFilter.addEventListener(
  "change",
  renderProducts
);


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value) {

  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}


/* START */

loadProducts();

</script>

</body>
</html>
