<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cart | E&B SHOP</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #111;
    }

    header {
      background: #111;
      color: white;
      padding: 18px 20px;
    }

    .header-inner {
      max-width: 1100px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .logo {
      color: white;
      text-decoration: none;
      font-size: 22px;
      font-weight: bold;
    }

    .home {
      color: white;
      text-decoration: none;
    }

    .container {
      max-width: 1100px;
      margin: 35px auto;
      padding: 0 20px;
    }

    h1 {
      margin-bottom: 25px;
    }

    .layout {
      display: grid;
      grid-template-columns: 1fr 330px;
      gap: 25px;
      align-items: start;
    }

    .cart-box,
    .summary {
      background: white;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.07);
    }

    .cart-item {
      display: grid;
      grid-template-columns: 90px 1fr auto;
      gap: 15px;
      align-items: center;
      padding: 15px 0;
      border-bottom: 1px solid #eee;
    }

    .cart-item:last-child {
      border-bottom: none;
    }

    .product-image {
      width: 90px;
      height: 90px;
      border-radius: 10px;
      object-fit: cover;
      background: #eee;
    }

    .product-name {
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 7px;
    }

    .product-price {
      color: #555;
      margin-bottom: 10px;
    }

    .quantity {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .quantity button {
      width: 30px;
      height: 30px;
      border: 1px solid #ccc;
      background: white;
      border-radius: 6px;
      cursor: pointer;
      font-size: 17px;
    }

    .quantity span {
      min-width: 25px;
      text-align: center;
      font-weight: bold;
    }

    .item-right {
      text-align: right;
    }

    .item-total {
      font-weight: bold;
      margin-bottom: 10px;
    }

    .remove {
      border: none;
      background: none;
      color: #d00;
      cursor: pointer;
      font-size: 14px;
    }

    .summary h2 {
      margin-bottom: 20px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      margin: 12px 0;
    }

    .total {
      border-top: 1px solid #ddd;
      padding-top: 15px;
      margin-top: 15px;
      font-size: 20px;
      font-weight: bold;
    }

    .checkout {
      width: 100%;
      border: none;
      background: #111;
      color: white;
      padding: 15px;
      border-radius: 9px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 20px;
    }

    .checkout:hover {
      background: #333;
    }

    .empty {
      text-align: center;
      padding: 50px 20px;
      color: #666;
    }

    .empty a {
      display: inline-block;
      margin-top: 15px;
      background: #111;
      color: white;
      text-decoration: none;
      padding: 12px 18px;
      border-radius: 8px;
    }

    @media (max-width: 750px) {

      .layout {
        grid-template-columns: 1fr;
      }

      .cart-item {
        grid-template-columns: 70px 1fr;
      }

      .product-image {
        width: 70px;
        height: 70px;
      }

      .item-right {
        grid-column: 2;
        text-align: left;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="header-inner">
    <a href="index.html" class="logo">E&B SHOP</a>
    <a href="index.html" class="home">Home</a>
  </div>
</header>

<div class="container">

  <h1>Your Cart</h1>

  <div id="cartContent"></div>

</div>

<script>

  const cartContent =
    document.getElementById("cartContent");

  function getCart() {

    try {

      const cart =
        JSON.parse(localStorage.getItem("cart")) || [];

      return Array.isArray(cart) ? cart : [];

    } catch (error) {

      return [];

    }

  }

  function saveCart(cart) {

    localStorage.setItem(
      "cart",
      JSON.stringify(cart)
    );

  }

  function getQuantity(item) {

    return Number(
      item.quantity ||
      item.qty ||
      1
    );

  }

  function renderCart() {

    const cart = getCart();

    if (cart.length === 0) {

      cartContent.innerHTML = `
        <div class="cart-box empty">

          <h2>Your cart is empty</h2>

          <p>
            Add a product to your cart before checkout.
          </p>

          <a href="products.html">
            Continue Shopping
          </a>

        </div>
      `;

      return;
    }

    let subtotal = 0;
    let itemsCount = 0;

    let itemsHTML = "";

    cart.forEach((item, index) => {

      const price =
        Number(item.price) || 0;

      const quantity =
        getQuantity(item);

      const itemTotal =
        price * quantity;

      subtotal += itemTotal;

      itemsCount += quantity;

      const image =
        item.imageUrl ||
        item.image ||
        "";

      itemsHTML += `

        <div class="cart-item">

          <img
            class="product-image"
            src="${escapeHTML(image)}"
            alt="${escapeHTML(item.name || "Product")}"
            onerror="this.style.display='none'"
          >

          <div>

            <div class="product-name">
              ${escapeHTML(item.name || "Product")}
            </div>

            <div class="product-price">
              ${price.toFixed(2)} SEK each
            </div>

            <div class="quantity">

              <button
                onclick="changeQuantity(${index}, -1)"
              >
                −
              </button>

              <span>
                ${quantity}
              </span>

              <button
                onclick="changeQuantity(${index}, 1)"
              >
                +
              </button>

            </div>

          </div>

          <div class="item-right">

            <div class="item-total">
              ${itemTotal.toFixed(2)} SEK
            </div>

            <button
              class="remove"
              onclick="removeItem(${index})"
            >
              Remove
            </button>

          </div>

        </div>

      `;

    });

    cartContent.innerHTML = `

      <div class="layout">

        <div class="cart-box">

          ${itemsHTML}

        </div>

        <div class="summary">

          <h2>Order Summary</h2>

          <div class="summary-row">

            <span>Items</span>

            <strong>
              ${itemsCount}
            </strong>

          </div>

          <div class="summary-row">

            <span>Subtotal</span>

            <strong>
              ${subtotal.toFixed(2)} SEK
            </strong>

          </div>

          <div class="summary-row">

            <span>Delivery</span>

            <strong>
              Free
            </strong>

          </div>

          <div class="summary-row total">

            <span>Total</span>

            <strong>
              ${subtotal.toFixed(2)} SEK
            </strong>

          </div>

          <button
            class="checkout"
            onclick="goToCheckout()"
          >
            Checkout
          </button>

        </div>

      </div>

    `;

  }

  function changeQuantity(index, amount) {

    const cart = getCart();

    if (!cart[index]) return;

    const current =
      getQuantity(cart[index]);

    const newQuantity =
      current + amount;

    if (newQuantity <= 0) {

      cart.splice(index, 1);

    } else {

      cart[index].quantity =
        newQuantity;

      delete cart[index].qty;

    }

    saveCart(cart);

    renderCart();

  }

  function removeItem(index) {

    const cart = getCart();

    cart.splice(index, 1);

    saveCart(cart);

    renderCart();

  }

  function goToCheckout() {

    const cart = getCart();

    if (cart.length === 0) {

      return;

    }

    window.location.href =
      "payment.html";

  }

  function escapeHTML(value) {

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }

  renderCart();

</script>

</body>
</html>
