<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Product Details | E&B MARKETIZA</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #111;
    }

    header {
      background: #111;
      color: white;
      padding: 18px 20px;
    }

    .header-inner {
      max-width: 1100px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo {
      color: white;
      text-decoration: none;
      font-size: 22px;
      font-weight: bold;
    }

    nav {
      display: flex;
      gap: 18px;
    }

    nav a {
      color: white;
      text-decoration: none;
    }

    .cart-link {
      font-weight: bold;
    }

    .container {
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .back {
      display: inline-block;
      margin-bottom: 20px;
      color: #111;
      text-decoration: none;
    }

    .product-box {
      background: white;
      border-radius: 16px;
      padding: 25px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      box-shadow: 0 5px 25px rgba(0, 0, 0, 0.07);
    }

    .image-box {
      width: 100%;
      min-height: 450px;
      background: #f1f1f1;
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .product-image {
      width: 100%;
      height: 450px;
      object-fit: contain;
      display: block;
    }

    .details {
      padding: 10px 0;
    }

    .category {
      display: inline-block;
      background: #eee;
      padding: 7px 12px;
      border-radius: 20px;
      font-size: 13px;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 34px;
      margin-bottom: 15px;
    }

    .price {
      font-size: 27px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .description {
      color: #555;
      line-height: 1.7;
      margin-bottom: 25px;
      white-space: pre-line;
    }

    .stock {
      margin-bottom: 20px;
      font-weight: bold;
    }

    .quantity-label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .quantity {
      display: flex;
      align-items: center;
      width: fit-content;
      border: 1px solid #ccc;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .quantity button {
      width: 42px;
      height: 42px;
      border: none;
      background: #f5f5f5;
      cursor: pointer;
      font-size: 20px;
    }

    .quantity span {
      width: 45px;
      text-align: center;
      font-weight: bold;
    }

    .add-cart {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 9px;
      background: #111;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .add-cart:hover {
      background: #333;
    }

    .add-cart:disabled {
      background: #999;
      cursor: not-allowed;
    }

    .message {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
    }

    .loading,
    .error {
      background: white;
      border-radius: 14px;
      padding: 50px;
      text-align: center;
    }

    .error {
      color: #c00;
    }

    @media (max-width: 800px) {
      .product-box {
        grid-template-columns: 1fr;
        gap: 25px;
      }

      .image-box {
        min-height: 300px;
      }

      .product-image {
        height: 300px;
      }

      h1 {
        font-size: 28px;
      }

      nav {
        gap: 10px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="header-inner">

    <a href="index.html" class="logo">
      E&B MARKETIZA
    </a>

    <nav>
      <a href="products.html">Products</a>

      <a href="cart.html" class="cart-link">
        Cart 🛒
      </a>
    </nav>

  </div>
</header>


<div class="container">

  <a href="products.html" class="back">
    ← Back to Products
  </a>

  <div id="productContainer">

    <div class="loading">
      Loading product...
    </div>

  </div>

</div>


<script type="module">

  import { db } from "./firebase-config.js";

  import {
    doc,
    getDoc
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


  const productContainer =
    document.getElementById("productContainer");

  let product = null;
  let quantity = 1;


  const params =
    new URLSearchParams(
      window.location.search
    );

  const productId =
    params.get("id");


  if (!productId) {

    showError(
      "Product was not specified."
    );

  } else {

    loadProduct();

  }


  async function loadProduct() {

    try {

      const productRef =
        doc(
          db,
          "products",
          productId
        );

      const productSnap =
        await getDoc(productRef);


      if (!productSnap.exists()) {

        showError(
          "This product does not exist."
        );

        return;

      }


      product = {
        id: productSnap.id,
        ...productSnap.data()
      };


      renderProduct();

    } catch (error) {

      console.error(
        "Product loading error:",
        error
      );

      showError(
        "Unable to load this product."
      );

    }

  }


  function renderProduct() {

    const price =
      Number(product.price) || 0;

    const stock =
      Number(product.stock) || 0;


    productContainer.innerHTML = `

      <div class="product-box">

        <div class="image-box">

          <img
            id="productImage"
            class="product-image"
            src="${escapeHTML(product.imageUrl || "")}"
            alt="${escapeHTML(product.name || "Product")}"
          >

        </div>


        <div class="details">

          <span class="category">
            ${escapeHTML(product.category || "Other")}
          </span>


          <h1>
            ${escapeHTML(product.name || "Product")}
          </h1>


          <div class="price">
            ${price.toFixed(2)} SEK
          </div>


          <div class="description">
            ${escapeHTML(
              product.description ||
              "No description available."
            )}
          </div>


          <div class="stock">

            ${
              stock > 0
                ? `In stock: ${stock}`
                : "Out of stock"
            }

          </div>


          <label class="quantity-label">
            Quantity
          </label>


          <div class="quantity">

            <button
              id="minusButton"
              type="button"
            >
              −
            </button>

            <span id="quantityValue">
              1
            </span>

            <button
              id="plusButton"
              type="button"
            >
              +
            </button>

          </div>


          <button
            id="addCartButton"
            class="add-cart"
            ${stock <= 0 ? "disabled" : ""}
          >

            ${
              stock > 0
                ? "Add to Cart"
                : "Out of Stock"
            }

          </button>


          <div
            id="message"
            class="message"
          ></div>

        </div>

      </div>

    `;


    const minusButton =
      document.getElementById(
        "minusButton"
      );

    const plusButton =
      document.getElementById(
        "plusButton"
      );

    const addCartButton =
      document.getElementById(
        "addCartButton"
      );


    minusButton.addEventListener(
      "click",
      () => {

        if (quantity > 1) {

          quantity--;

          updateQuantity();

        }

      }
    );


    plusButton.addEventListener(
      "click",
      () => {

        if (quantity < stock) {

          quantity++;

          updateQuantity();

        }

      }
    );


    addCartButton.addEventListener(
      "click",
      addToCart
    );


    const image =
      document.getElementById(
        "productImage"
      );


    image.addEventListener(
      "error",
      () => {

        image.style.display =
          "none";

      }
    );

  }


  function updateQuantity() {

    const quantityValue =
      document.getElementById(
        "quantityValue"
      );

    if (quantityValue) {

      quantityValue.textContent =
        quantity;

    }

  }


  function addToCart() {

    if (!product) {
      return;
    }


    const stock =
      Number(product.stock) || 0;


    if (stock <= 0) {
      return;
    }


    let cart = [];


    try {

      cart =
        JSON.parse(
          localStorage.getItem("cart")
        ) || [];

      if (!Array.isArray(cart)) {
        cart = [];
      }

    } catch (error) {

      cart = [];

    }


    const existingIndex =
      cart.findIndex(
        item =>
          item.productId === product.id
      );


    if (existingIndex !== -1) {

      const newQuantity =
        Number(
          cart[existingIndex].quantity || 0
        ) + quantity;


      if (newQuantity > stock) {

        showMessage(
          `Only ${stock} item(s) available.`
        );

        return;

      }


      cart[existingIndex].quantity =
        newQuantity;

    } else {

      cart.push({

        productId: product.id,

        name: product.name || "",

        price: Number(product.price) || 0,

        imageUrl: product.imageUrl || "",

        category: product.category || "",

        quantity: quantity

      });

    }


    localStorage.setItem(
      "cart",
      JSON.stringify(cart)
    );


    showMessage(
      "Product added to cart ✓"
    );


    quantity = 1;

    updateQuantity();

  }


  function showMessage(text) {

    const message =
      document.getElementById(
        "message"
      );

    if (!message) {
      return;
    }

    message.textContent =
      text;


    setTimeout(() => {

      message.textContent = "";

    }, 3000);

  }


  function showError(text) {

    productContainer.innerHTML = `

      <div class="error">
        ${escapeHTML(text)}
      </div>

    `;

  }


  function escapeHTML(value) {

    return String(value)

      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }

</script>

</body>
</html>
