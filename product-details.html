<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Product Details | EB MARKETIZA</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #111827;
    }

    nav {
      background: #111827;
      color: white;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 15px;
    }

    nav a:hover {
      color: #60a5fa;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
    }

    .container {
      max-width: 1100px;
      margin: 40px auto;
      padding: 20px;
    }

    .back {
      display: inline-block;
      margin-bottom: 20px;
      color: #2563eb;
      text-decoration: none;
      font-weight: bold;
    }

    .product {
      background: white;
      border-radius: 16px;
      padding: 25px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 35px;
      box-shadow: 0 5px 20px rgba(0,0,0,.08);
    }

    .image-box {
      width: 100%;
    }

    .main-image-box {
      width: 100%;
      height: 450px;
      background: #f3f4f6;
      border-radius: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .main-image {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .no-image {
      color: #6b7280;
      text-align: center;
      padding: 20px;
    }

    .gallery {
      display: flex;
      gap: 10px;
      margin-top: 15px;
      overflow-x: auto;
    }

    .thumb {
      width: 75px;
      height: 75px;
      min-width: 75px;
      object-fit: cover;
      border-radius: 8px;
      cursor: pointer;
      border: 2px solid transparent;
      background: #f3f4f6;
    }

    .thumb:hover,
    .thumb.active {
      border-color: #2563eb;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 15px;
    }

    .category {
      display: inline-block;
      background: #e5edff;
      color: #2563eb;
      padding: 7px 12px;
      border-radius: 20px;
      margin-bottom: 20px;
    }

    .price {
      font-size: 28px;
      font-weight: bold;
      color: #2563eb;
      margin: 20px 0;
    }

    .description {
      line-height: 1.7;
      color: #4b5563;
      margin-bottom: 20px;
      white-space: pre-wrap;
    }

    .stock {
      margin-bottom: 20px;
      font-weight: bold;
    }

    .in-stock {
      color: #16a34a;
    }

    .out-stock {
      color: #dc2626;
    }

    .quantity {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .quantity button {
      width: 38px;
      height: 38px;
      border: none;
      background: #e5e7eb;
      border-radius: 8px;
      font-size: 20px;
      cursor: pointer;
    }

    .quantity button:hover {
      background: #d1d5db;
    }

    .quantity span {
      font-size: 18px;
      font-weight: bold;
    }

    .add-cart {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .add-cart:hover {
      background: #1d4ed8;
    }

    .add-cart:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }

    .message {
      text-align: center;
      padding: 50px 20px;
    }

    .error {
      color: #dc2626;
    }

    .error-box {
      background: #fee2e2;
      border: 1px solid #fecaca;
      color: #991b1b;
      padding: 15px;
      border-radius: 10px;
      margin-top: 15px;
      word-break: break-word;
    }

    @media (max-width: 700px) {
      .product {
        grid-template-columns: 1fr;
      }

      .main-image-box {
        height: 330px;
      }

      h1 {
        font-size: 26px;
      }

      nav {
        flex-direction: column;
        gap: 12px;
      }
    }
  </style>
</head>

<body>

  <div style="max-width:1200px;margin:8px auto;padding:0 20px;text-align:right;">
    <label for="marketCurrency">Currency: </label>

    <select id="marketCurrency">
      <option value="EUR">EUR €</option>
      <option value="USD">USD $</option>
      <option value="SEK">SEK kr</option>
    </select>
  </div>

  <nav>
    <div class="logo">EB MARKETIZA</div>

    <div>
      <a href="index.html">Home</a>
      <a href="products.html">Products</a>
      <a href="cart.html">Cart 🛒</a>
    </div>
  </nav>

  <div class="container">

    <a href="products.html" class="back">
      ← Back to Products
    </a>

    <div id="message" class="message">
      Loading product...
    </div>

    <div id="productContainer"></div>

  </div>

  <script type="module">

    import {
      initMarketSelector,
      formatMoneyFromSEK
    } from "./market-config.js";

    import { supabase } from "./supabaseClient.js";


    try {
      initMarketSelector();
    } catch (error) {
      console.warn("Currency selector error:", error);
    }


    const params = new URLSearchParams(
      window.location.search
    );

    const productId = params.get("id");

    const message =
      document.getElementById("message");

    const productContainer =
      document.getElementById("productContainer");


    let product = null;

    let images = [];

    let quantity = 1;


    function escapeHtml(value) {

      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }


    function showError(text) {

      message.style.display = "block";

      message.innerHTML = `
        <div class="error">

          <h2>Could not load product</h2>

          <div class="error-box">
            ${escapeHtml(text)}
          </div>

          <br>

          <a href="products.html">
            ← Back to Products
          </a>

        </div>
      `;
    }


    async function loadProduct() {

      if (!productId) {

        showError("Product ID is missing.");

        return;
      }


      try {

        const {
          data,
          error
        } = await supabase
          .from("products")
          .select("*")
          .eq("id", productId)
          .maybeSingle();


        if (error) {

          console.error(
            "Product error:",
            error
          );

          showError(
            "Product error: " +
            error.message
          );

          return;
        }


        if (!data) {

          showError(
            "Product was not found."
          );

          return;
        }


        product = data;


        /*
          Load product images.
        */

        const {
          data: imageData,
          error: imageError
        } = await supabase
          .from("product_images")
          .select("*")
          .eq("product_id", productId)
          .order("sort_order", {
            ascending: true
          });


        if (imageError) {

          console.error(
            "Product images error:",
            imageError
          );

          images = [];

        } else {

          images = imageData || [];

        }


        console.log(
          "PRODUCT:",
          product
        );

        console.log(
          "IMAGES:",
          images
        );


        renderProduct();


      } catch (error) {

        console.error(error);

        showError(
          error.message ||
          "Unexpected error."
        );
      }
    }


    function getImageUrl(image) {

      if (!image) {
        return "";
      }


      /*
        Support the normal image_url column.
      */

      if (image.image_url) {
        return String(
          image.image_url
        ).trim();
      }


      if (image.url) {
        return String(
          image.url
        ).trim();
      }


      if (image.public_url) {
        return String(
          image.public_url
        ).trim();
      }


      return "";
    }


    function renderProduct() {

      message.style.display = "none";


      /*
        Create image URLs.
      */

      let imageUrls = [];


      images.forEach(image => {

        const url =
          getImageUrl(image);

        if (url) {
          imageUrls.push(url);
        }

      });


      /*
        If product_images is empty,
        use products.image.
      */

      if (
        imageUrls.length === 0 &&
        product.image
      ) {

        imageUrls.push(
          String(product.image).trim()
        );

      }


      /*
        Remove duplicate images.
      */

      imageUrls = [
        ...new Set(imageUrls)
      ];


      const mainImage =
        imageUrls.length > 0
          ? imageUrls[0]
          : "";


      let galleryHTML = "";


      if (imageUrls.length > 0) {

        galleryHTML =
          imageUrls.map((url, index) => {

            return `
              <img
                src="${escapeHtml(url)}"
                class="thumb ${
                  index === 0
                    ? "active"
                    : ""
                }"
                data-url="${escapeHtml(url)}"
                alt="Product image"
              >
            `;

          }).join("");

      }


      const mainImageHTML =
        mainImage

          ? `
            <img
              id="mainImage"
              src="${escapeHtml(mainImage)}"
              class="main-image"
              alt="${escapeHtml(product.name)}"
            >
          `

          : `
            <div class="no-image">
              No product image available.
            </div>
          `;


      const stock =
        Number(product.stock || 0);


      productContainer.innerHTML = `

        <div class="product">

          <div class="image-box">

            <div class="main-image-box">
              ${mainImageHTML}
            </div>

            <div class="gallery">
              ${galleryHTML}
            </div>

          </div>


          <div>

            <span class="category">
              ${escapeHtml(
                product.category ||
                "General"
              )}
            </span>

            <h1>
              ${escapeHtml(
                product.name ||
                "Product"
              )}
            </h1>

            <div class="price">
              ${formatMoneyFromSEK(
                Number(product.price || 0)
              )}
            </div>

            <div class="description">
              ${escapeHtml(
                product.description ||
                "No description available."
              )}
            </div>


            ${
              stock > 0

                ? `
                  <div class="stock in-stock">
                    In stock: ${stock}
                  </div>
                `

                : `
                  <div class="stock out-stock">
                    Out of stock
                  </div>
                `
            }


            ${
              stock > 0

                ? `

                  <div class="quantity">

                    <button
                      type="button"
                      id="minusButton"
                    >
                      −
                    </button>

                    <span id="quantity">
                      1
                    </span>

                    <button
                      type="button"
                      id="plusButton"
                    >
                      +
                    </button>

                  </div>

                  <button
                    class="add-cart"
                    id="addCartButton"
                    type="button"
                  >
                    🛒 Add to Cart
                  </button>

                `

                : `

                  <button
                    class="add-cart"
                    disabled
                  >
                    Out of Stock
                  </button>

                `
            }

          </div>

        </div>
      `;


      /*
        Gallery events.
      */

      document
        .querySelectorAll(".thumb")
        .forEach(thumb => {

          thumb.addEventListener(
            "click",
            () => {

              const url =
                thumb.dataset.url;

              const main =
                document.getElementById(
                  "mainImage"
                );

              if (main) {
                main.src = url;
              }


              document
                .querySelectorAll(".thumb")
                .forEach(item => {
                  item.classList.remove(
                    "active"
                  );
                });


              thumb.classList.add(
                "active"
              );

            }
          );

        });


      /*
        Quantity buttons.
      */

      const minus =
        document.getElementById(
          "minusButton"
        );

      const plus =
        document.getElementById(
          "plusButton"
        );


      if (minus) {

        minus.addEventListener(
          "click",
          () => changeQuantity(-1)
        );

      }


      if (plus) {

        plus.addEventListener(
          "click",
          () => changeQuantity(1)
        );

      }


      /*
        Add to cart.
      */

      const addButton =
        document.getElementById(
          "addCartButton"
        );


      if (addButton) {

        addButton.addEventListener(
          "click",
          addToCart
        );

      }
    }


    function changeQuantity(change) {

      if (!product) {
        return;
      }


      const max =
        Number(product.stock || 0);


      quantity += change;


      if (quantity < 1) {
        quantity = 1;
      }


      if (quantity > max) {
        quantity = max;
      }


      const quantityElement =
        document.getElementById(
          "quantity"
        );


      if (quantityElement) {

        quantityElement.textContent =
          quantity;

      }
    }


    async function addToCart() {

      if (!product) {
        return;
      }


      const button =
        document.getElementById(
          "addCartButton"
        );


      try {

        button.disabled = true;

        button.textContent =
          "Adding...";


        const {
          data: {
            session
          }
        } =
          await supabase.auth.getSession();


        if (!session) {

          alert(
            "Please login before adding products to your cart."
          );


          window.location.href =
            "login.html?redirect=" +
            encodeURIComponent(
              window.location.pathname +
              window.location.search
            );


          return;
        }


        const userId =
          session.user.id;


        const {
          data: existing,
          error: existingError
        } =
          await supabase
            .from("cart_items")
            .select("*")
            .eq("user_id", userId)
            .eq("product_id", product.id)
            .maybeSingle();


        if (existingError) {

          console.error(
            existingError
          );

          alert(
            "Could not check your cart."
          );

          return;
        }


        let result;


        if (existing) {

          let newQuantity =
            Number(existing.quantity || 0) +
            quantity;


          if (
            newQuantity >
            Number(product.stock)
          ) {

            newQuantity =
              Number(product.stock);

          }


          result =
            await supabase
              .from("cart_items")
              .update({
                quantity: newQuantity
              })
              .eq("id", existing.id)
              .eq("user_id", userId);

        } else {

          result =
            await supabase
              .from("cart_items")
              .insert({
                user_id: userId,
                product_id: product.id,
                quantity: quantity
              });

        }


        if (result.error) {

          console.error(
            result.error
          );

          alert(
            "Could not add product to cart: " +
            result.error.message
          );

          return;
        }


        alert(
          "Product added to your cart 🛒"
        );


        quantity = 1;


        const quantityElement =
          document.getElementById(
            "quantity"
          );


        if (quantityElement) {

          quantityElement.textContent =
            "1";

        }


      } catch (error) {

        console.error(error);

        alert(
          "Something went wrong: " +
          error.message
        );


      } finally {

        if (button) {

          button.disabled = false;

          button.textContent =
            "🛒 Add to Cart";

        }
      }
    }


    /*
      START
    */

    loadProduct();

  </script>

</body>
</html>
