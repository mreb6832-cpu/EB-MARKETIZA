<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Register | E&B MARKETIZA</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .register-box {
      width: 100%;
      max-width: 430px;
      background: white;
      padding: 35px;
      border-radius: 18px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.12);
    }

    .logo {
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .logo span {
      color: #00d084;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 28px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 10px;
      margin-bottom: 18px;
      font-size: 15px;
    }

    input:focus {
      outline: none;
      border-color: #00d084;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #111;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #333;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 18px;
      text-align: center;
      font-size: 14px;
      line-height: 1.5;
      word-break: break-word;
    }

    .login-link,
    .back {
      display: block;
      text-align: center;
      text-decoration: none;
    }

    .login-link {
      margin-top: 20px;
      color: #111;
      font-weight: bold;
    }

    .back {
      margin-top: 15px;
      color: #777;
      font-size: 14px;
    }

    .login-link:hover,
    .back:hover {
      text-decoration: underline;
    }

    @media (max-width: 480px) {
      body {
        padding: 12px;
      }

      .register-box {
        padding: 25px 20px;
        border-radius: 14px;
      }

      .logo {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

  <div class="register-box">

    <div class="logo">
      E&B <span>MARKETIZA</span>
    </div>

    <div class="subtitle">
      Create your account
    </div>

    <form id="registerForm">

      <label for="name">
        Full Name
      </label>

      <input
        type="text"
        id="name"
        placeholder="Enter your full name"
        autocomplete="name"
        required
      >

      <label for="email">
        Email
      </label>

      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        autocomplete="email"
        required
      >

      <label for="password">
        Password
      </label>

      <input
        type="password"
        id="password"
        placeholder="Create a password"
        autocomplete="new-password"
        minlength="6"
        required
      >

      <label for="confirmPassword">
        Confirm Password
      </label>

      <input
        type="password"
        id="confirmPassword"
        placeholder="Confirm your password"
        autocomplete="new-password"
        minlength="6"
        required
      >

      <button
        type="submit"
        id="registerButton"
      >
        Create Account
      </button>

    </form>

    <div id="message"></div>

    <a
      href="login.html"
      class="login-link"
    >
      Already have an account? Login
    </a>

    <a
      href="index.html"
      class="back"
    >
      ← Back to Home
    </a>

  </div>


  <script type="module">

    import { supabase } from "./supabaseClient.js";


    const registerForm =
      document.getElementById("registerForm");

    const registerButton =
      document.getElementById("registerButton");

    const message =
      document.getElementById("message");


    registerForm.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();


        const name =
          document
            .getElementById("name")
            .value
            .trim();

        const email =
          document
            .getElementById("email")
            .value
            .trim();

        const password =
          document
            .getElementById("password")
            .value;

        const confirmPassword =
          document
            .getElementById("confirmPassword")
            .value;


        message.textContent = "";


        if (password !== confirmPassword) {

          message.style.color = "red";

          message.textContent =
            "Passwords do not match.";

          return;

        }


        if (password.length < 6) {

          message.style.color = "red";

          message.textContent =
            "Password must be at least 6 characters.";

          return;

        }


        registerButton.disabled = true;

        registerButton.textContent =
          "Creating Account...";


        try {

          const {
            data,
            error
          } =
            await supabase.auth.signUp({

              email: email,

              password: password,

              options: {

                data: {
                  full_name: name
                },

                emailRedirectTo:
                  `${window.location.origin}/login.html`

              }

            });


          if (error) {
            throw error;
          }


          /*
            Supabase may return a user without
            a session when email confirmation
            is enabled.
          */

          if (
            data.user &&
            !data.session
          ) {

            message.style.color =
              "green";

            message.innerHTML =
              "Account created successfully.<br><br>" +
              "Please check your email and click the verification link " +
              "to verify your account.<br><br>" +
              "After verification, return here and log in.";

            registerForm.reset();

            return;

          }


          /*
            If email confirmation is disabled,
            the user can be logged in immediately.
          */

          if (data.session) {

            message.style.color =
              "green";

            message.textContent =
              "Account created successfully. Opening your account...";


            setTimeout(() => {

              window.location.href =
                "account.html";

            }, 1000);

          }


        } catch (error) {

          console.error(
            "SUPABASE REGISTRATION ERROR:",
            error
          );


          message.style.color =
            "red";


          if (
            error.message
              .toLowerCase()
              .includes("already registered")
          ) {

            message.textContent =
              "This email is already registered. Please log in.";

          } else {

            message.textContent =
              error.message ||
              "Registration failed.";

          }

        } finally {

          registerButton.disabled =
            false;

          registerButton.textContent =
            "Create Account";

        }

      }
    );

  </script>

</body>
</html>
