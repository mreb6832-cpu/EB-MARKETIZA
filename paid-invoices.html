<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paid Invoices | EB-MARKETIZA</title>

<!-- Vercel Speed Insights -->
<script>
  window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
</script>
<script defer src="/_vercel/speed-insights/script.js"></script>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f6f9;color:#111827}
header{background:#111827;color:white;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
header a,header button{background:#2563eb;color:white;text-decoration:none;border:0;padding:10px 13px;border-radius:8px;cursor:pointer}
main{max-width:1050px;margin:28px auto;padding:0 15px}
h1{margin-bottom:8px}
.muted{color:#6b7280;line-height:1.5}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}
.toolbar input{flex:1;min-width:180px;padding:12px;border:1px solid #d1d5db;border-radius:8px}
button{cursor:pointer}
.refresh{background:#111827;color:white;border:0;border-radius:8px;padding:11px 15px}
#message{padding:13px;border-radius:8px;background:#fff;margin:15px 0;overflow-wrap:anywhere}
.invoice-list{display:grid;gap:16px}
.invoice-card{background:white;border:1px solid #e5e7eb;border-radius:13px;padding:20px;box-shadow:0 4px 15px #00000008}
.invoice-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:1px solid #e5e7eb;padding-bottom:13px}
.paid{display:inline-block;background:#dcfce7;color:#166534;border-radius:20px;padding:6px 10px;font-weight:bold;font-size:12px}
.details{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:17px}
.details h3{font-size:14px;margin-bottom:7px}
.details p{line-height:1.6;color:#4b5563;overflow-wrap:anywhere}
.items{width:100%;border-collapse:collapse;margin-top:15px}
.items th,.items td{padding:10px;border-bottom:1px solid #e5e7eb;text-align:left}
.total{display:flex;justify-content:space-between;gap:12px;margin-top:15px;padding-top:13px;border-top:2px solid #111827;font-weight:bold;font-size:18px}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}
.print{background:#ff5a00;color:white;border:0;padding:11px 15px;border-radius:8px;font-weight:bold}
.empty{background:white;border-radius:12px;padding:28px;text-align:center;color:#6b7280}
@media(max-width:600px){
 .details{grid-template-columns:1fr}
 .invoice-card{padding:14px}
 .items{font-size:12px}
 .items th,.items td{padding:7px}
}
@media print{
 body{background:white}
 header,.page-intro,.toolbar,#message,.actions{display:none!important}
 main{max-width:none;margin:0;padding:0}
 .invoice-list{display:block}
 .invoice-card{display:none!important;box-shadow:none;border:0;padding:0}
 .invoice-card.printing{display:block!important;break-inside:avoid}
}
</style>
</head>

<body>
<header>
<strong>EB-MARKETIZA — Invoices</strong>
<nav>
<a href="account.html">My Account</a>
<a href="index.html">Store</a>
<button id="logoutButton" type="button">Logout</button>
</nav>
</header>

<main>
<section class="page-intro">
<h1 id="pageTitle">Paid Invoices</h1>
<p class="muted" id="pageDescription">
Invoices for successfully paid orders.
</p>
</section>

<div class="toolbar">
<input id="search" type="search"
placeholder="Search invoice, order or customer...">
<button id="refreshButton" class="refresh" type="button">
Refresh
</button>
</div>

<div id="message" role="status">Loading paid invoices...</div>
<div id="invoiceList" class="invoice-list"></div>
</main>

<script type="module">
import { supabase } from "./supabaseClient.js";

const ADMIN_EMAIL = "mucyoemmy539@gmail.com";

const message = document.getElementById("message");
const invoiceList = document.getElementById("invoiceList");
const search = document.getElementById("search");

let user = null;
let isAdmin = false;
let invoices = [];

const money = value => new Intl.NumberFormat("sv-SE", {
  style: "currency",
  currency: "SEK"
}).format(Number(value || 0));

const esc = value => String(value ?? "")
  .replaceAll("&", "&amp;")
  .replaceAll("<", "&lt;")
  .replaceAll(">", "&gt;")
  .replaceAll('"', "&quot;")
  .replaceAll("'", "&#039;");

function date(value) {
  if (!value) return "-";
  const parsed = new Date(value);
  return Number.isNaN(parsed.getTime())
    ? "-"
    : parsed.toLocaleString("en-SE");
}

function showMessage(text) {
  message.textContent = text;
  message.style.display = "block";
}

async function start() {
  try {
    const { data, error } = await supabase.auth.getUser();
    if (error) throw error;

    user = data.user;

    if (!user) {
      window.location.href = "login.html";
      return;
    }

    isAdmin =
      (user.email || "").toLowerCase() === ADMIN_EMAIL.toLowerCase();

    document.getElementById("pageTitle").textContent =
      isAdmin ? "Paid Invoices — Admin" : "My Paid Invoices";

    document.getElementById("pageDescription").textContent =
      isAdmin
        ? "View and print invoices for orders confirmed as paid."
        : "View and print invoices for your successfully paid orders.";

    await loadInvoices();
  } catch (error) {
    console.error(error);
    showMessage(error.message || "Could not load invoices.");
  }
}

async function loadInvoices() {
  showMessage("Loading paid invoices...");
  invoiceList.replaceChildren();

  let query = supabase
    .from("orders")
    .select("*")
    .eq("payment_status", "paid")
    .order("created_at", { ascending: false });

  // Customers may only request their own orders.
  // Admin access must also be allowed by the database RLS policy.
  if (!isAdmin) {
    query = query.eq("user_id", user.id);
  }

  const { data, error } = await query;

  if (error) throw error;

  invoices = data || [];
  renderInvoices();
}

function renderInvoices() {
  invoiceList.replaceChildren();

  const term = search.value.trim().toLowerCase();

  const filtered = invoices.filter(order => {
    const text = [
      order.order_number,
      order.id,
      order.customer_name,
      order.customer_email,
      order.payment_reference
    ].join(" ").toLowerCase();

    return text.includes(term);
  });

  if (!filtered.length) {
    showMessage(
      invoices.length
        ? "No invoices match your search."
        : "No paid invoices found yet. An invoice appears here after Stripe confirms payment."
    );
    return;
  }

  message.style.display = "none";

  filtered.forEach(order => {
    const card = document.createElement("article");
    card.className = "invoice-card";
    card.id = "invoice-" + order.id;

    const address = [
      [order.street, order.house_number].filter(Boolean).join(" "),
      order.apartment ? "Apartment " + order.apartment : "",
      [order.postal_code, order.city].filter(Boolean).join(" "),
      order.country || "Sweden"
    ].filter(Boolean).join("\n");

    card.innerHTML = `
      <div class="invoice-head">
        <div>
          <strong>EB-MARKETIZA</strong>
          <p class="muted">Invoice / Order #${esc(order.order_number || order.id)}</p>
          <p class="muted">Date: ${esc(date(order.paid_at || order.created_at))}</p>
        </div>
        <div>
          <span class="paid">PAID</span>
          <p class="muted">${esc(order.payment_reference || order.stripe_session_id || "")}</p>
        </div>
      </div>

      <div class="details">
        <section>
          <h3>Customer</h3>
          <p>${esc(order.customer_name || "-")}<br>
          ${esc(order.customer_email || "-")}<br>
          ${esc(order.customer_phone || "-")}</p>
        </section>
        <section>
          <h3>Delivery address</h3>
          <p>${esc(address).replaceAll("\n", "<br>")}</p>
        </section>
      </div>

      <div class="items-wrap">
        <table class="items">
          <thead>
            <tr>
              <th>Product</th>
              <th>Qty</th>
              <th>Unit price</th>
              <th>Total</th>
            </tr>
          </thead>
          <tbody class="invoice-items-body">
            <tr><td colspan="4">Loading items...</td></tr>
          </tbody>
        </table>
      </div>

      <div class="total">
        <span>Total paid</span>
        <span>${money(order.total)}</span>
      </div>

      <div class="actions">
        <button class="print" type="button">Print Invoice</button>
      </div>
    `;

    card.querySelector(".print").addEventListener("click", () => {
      printInvoice(card);
    });

    invoiceList.appendChild(card);
    loadItems(order.id, card);
  });
}

async function loadItems(orderId, card) {
  const body = card.querySelector(".invoice-items-body");

  const { data, error } = await supabase
    .from("order_items")
    .select("*")
    .eq("order_id", orderId);

  if (error) {
    body.innerHTML =
      `<tr><td colspan="4">Could not load items.</td></tr>`;
    console.error(error);
    return;
  }

  if (!data || !data.length) {
    body.innerHTML =
      `<tr><td colspan="4">No order items found.</td></tr>`;
    return;
  }

  body.innerHTML = data.map(item => {
    const quantity = Number(item.quantity || 0);
    const unit = Number(item.unit_price || 0);
    const lineTotal = item.total_price != null
      ? Number(item.total_price)
      : unit * quantity;

    return `
      <tr>
        <td>${esc(item.product_name || "Product")}</td>
        <td>${quantity}</td>
        <td>${money(unit)}</td>
        <td>${money(lineTotal)}</td>
      </tr>
    `;
  }).join("");
}

function printInvoice(card) {
  document.querySelectorAll(".invoice-card")
    .forEach(item => item.classList.remove("printing"));

  card.classList.add("printing");

  window.print();

  setTimeout(() => card.classList.remove("printing"), 500);
}

document.getElementById("refreshButton").addEventListener(
  "click",
  async () => {
    try {
      await loadInvoices();
    } catch (error) {
      console.error(error);
      showMessage(error.message || "Could not refresh invoices.");
    }
  }
);

search.addEventListener("input", renderInvoices);

document.getElementById("logoutButton").addEventListener(
  "click",
  async () => {
    await supabase.auth.signOut();
    window.location.href = "login.html";
  }
);

start();
</script>
</body>
</html>
