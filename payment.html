<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>EB SHOP - Payment</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #172033;
    }

    header {
      background: #2563eb;
      color: white;
      padding: 18px 25px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .logo {
      font-size: 25px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .back-btn {
      color: white;
      text-decoration: none;
      font-weight: 600;
      background: rgba(255,255,255,0.15);
      padding: 9px 15px;
      border-radius: 9px;
    }

    .container {
      max-width: 1100px;
      margin: 35px auto;
      padding: 0 18px;
    }

    .title {
      text-align: center;
      margin-bottom: 28px;
    }

    .title h1 {
      font-size: 30px;
      margin-bottom: 8px;
    }

    .title p {
      color: #64748b;
    }

    .checkout {
      display: grid;
      grid-template-columns: 1.3fr 0.8fr;
      gap: 25px;
      align-items: start;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 8px 25px rgba(15, 23, 42, 0.07);
      border: 1px solid #e7edf5;
    }

    .card h2 {
      font-size: 20px;
      margin-bottom: 20px;
    }

    .product {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 15px 0;
      border-bottom: 1px solid #edf1f5;
    }

    .product:last-child {
      border-bottom: none;
    }

    .product img {
      width: 72px;
      height: 72px;
      border-radius: 12px;
      object-fit: cover;
      background: #f1f5f9;
    }

    .product-info {
      flex: 1;
    }

    .product-name {
      font-weight: 700;
      margin-bottom: 6px;
    }

    .product-qty {
      color: #64748b;
      font-size: 14px;
    }

    .product-price {
      font-weight: 700;
      color: #2563eb;
      white-space: nowrap;
    }

    .payment-methods {
      display: grid;
      gap: 12px;
    }

    .payment-option {
      position: relative;
    }

    .payment-option input {
      position: absolute;
      opacity: 0;
    }

    .payment-label {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 17px;
      border: 2px solid #e5e7eb;
      border-radius: 13px;
      cursor: pointer;
      transition: 0.2s;
      background: white;
    }

    .payment-label:hover {
      border-color: #93c5fd;
      background: #f8fbff;
    }

    .payment-option input:checked + .payment-label {
      border-color: #2563eb;
      background: #eff6ff;
    }

    .payment-icon {
      width: 45px;
      height: 45px;
      border-radius: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #eef4ff;
      font-size: 23px;
    }

    .payment-text {
      flex: 1;
    }

    .payment-name {
      font-weight: 700;
      margin-bottom: 4px;
    }

    .payment-description {
      color: #64748b;
      font-size: 13px;
    }

    .check {
      width: 20px;
      height: 20px;
      border: 2px solid #cbd5e1;
      border-radius: 50%;
    }

    .payment-option input:checked + .payment-label .check {
      border: 6px solid #2563eb;
    }

    .summary {
      margin-top: 25px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      color: #64748b;
    }

    .summary-row.total {
      margin-top: 10px;
      padding-top: 18px;
      border-top: 1px solid #e5e7eb;
      color: #172033;
      font-size: 21px;
      font-weight: 800;
    }

    .free {
      color: #16a34a;
      font-weight: 700;
    }

    .pay-btn {
      width: 100%;
      border: none;
      background: #2563eb;
      color: white;
      padding: 16px;
      border-radius: 12px;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 20px;
      transition: 0.2s;
    }

    .pay-btn:hover {
      background: #1d4ed8;
      transform: translateY(-1px);
    }

    .pay-btn:disabled {
      background: #94a3b8;
      cursor: not-allowed;
      transform: none;
    }

    .secure {
      text-align: center;
      margin-top: 13px;
      color: #64748b;
      font-size: 13px;
    }

    .message {
      display: none;
      margin-top: 15px;
      padding: 13px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.5;
    }

    .message.error {
      display: block;
      background: #fef2f2;
      color: #b91c1c;
      border: 1px solid #fecaca;
    }

    .message.info {
      display: block;
      background: #eff6ff;
      color: #1d4ed8;
      border: 1px solid #bfdbfe;
    }

    .empty {
      text-align: center;
      padding: 35px 10px;
      color: #64748b;
    }

    .empty a {
      display: inline-block;
      margin-top: 15px;
      color: white;
      background: #2563eb;
      text-decoration: none;
      padding: 11px 18px;
      border-radius: 9px;
      font-weight: 700;
    }

    .loading {
      text-align: center;
      padding: 35px;
      color: #64748b;
    }

    @media (max-width: 800px) {
      .checkout {
        grid-template-columns: 1fr;
      }

      .container {
        margin-top: 25px;
      }

      .title h1 {
        font-size: 25px;
      }
    }

    @media (max-width: 480px) {
      header {
        padding: 15px;
      }

      .logo {
        font-size: 21px;
      }

      .back-btn {
        padding: 8px 11px;
        font-size: 13px;
      }

      .card {
        padding: 18px;
        border-radius: 15px;
      }

      .product img {
        width: 60px;
        height: 60px;
      }

      .product-price {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">EB SHOP</div>
  <a href="cart.html" class="back-btn">← Cart</a>
</header>

<div class="container">

  <div class="title">
    <h1>Secure Checkout</h1>
    <p>Choose your preferred payment method</p>
  </div>

  <div id="loading" class="loading">
    Loading your cart...
  </div>

  <div id="emptyCart" class="empty" style="display:none;">
    <h2>Your cart is empty</h2>
    <p>Add products to your cart before checkout.</p>
    <a href="products.html">Browse Products</a>
  </div>

  <div id="checkout" class="checkout" style="display:none;">

    <!-- LEFT -->
    <div class="card">

      <h2>🛒 Your Order</h2>

      <div id="productList"></div>

      <div class="summary">

        <div class="summary-row">
          <span>Products</span>
          <span id="subtotal">0 SEK</span>
        </div>

        <div class="summary-row">
          <span>Delivery</span>
          <span class="free">FREE</span>
        </div>

        <div class="summary-row total">
          <span>Total</span>
          <span id="total">0 SEK</span>
        </div>

      </div>

    </div>

    <!-- RIGHT -->
    <div class="card">

      <h2>💳 Payment Method</h2>

      <div class="payment-methods">

        <!-- STRIPE -->
        <div class="payment-option">
          <input
            type="radio"
            id="stripe"
            name="payment"
            value="stripe"
            checked
          >

          <label for="stripe" class="payment-label">

            <div class="payment-icon">
              💳
            </div>

            <div class="payment-text">
              <div class="payment-name">
                Card
              </div>

              <div class="payment-description">
                Secure payment with Stripe
              </div>
            </div>

            <div class="check"></div>

          </label>
        </div>

        <!-- PAYPAL -->
        <div class="payment-option">
          <input
            type="radio"
            id="paypal"
            name="payment"
            value="paypal"
          >

          <label for="paypal" class="payment-label">

            <div class="payment-icon">
              🅿️
            </div>

            <div class="payment-text">
              <div class="payment-name">
                PayPal
              </div>

              <div class="payment-description">
                Pay securely with PayPal
              </div>
            </div>

            <div class="check"></div>

          </label>
        </div>

        <!-- SWISH -->
        <div class="payment-option">
          <input
            type="radio"
            id="swish"
            name="payment"
            value="swish"
          >

          <label for="swish" class="payment-label">

            <div class="payment-icon">
              📱
            </div>

            <div class="payment-text">
              <div class="payment-name">
                Swish
              </div>

              <div class="payment-description">
                Pay with Swish
              </div>
            </div>

            <div class="check"></div>

          </label>
        </div>

      </div>

      <div id="message" class="message"></div>

      <button id="payButton" class="pay-btn">
        Pay Now
      </button>

      <div class="secure">
        🔒 Secure checkout • EB SHOP
      </div>

    </div>

  </div>

</div>

<script type="module">

  import { supabase } from "./supabaseClient.js";

  const loading = document.getElementById("loading");
  const emptyCart = document.getElementById("emptyCart");
  const checkout = document.getElementById("checkout");
  const productList = document.getElementById("productList");

  const subtotalEl = document.getElementById("subtotal");
  const totalEl = document.getElementById("total");

  const payButton = document.getElementById("payButton");
  const message = document.getElementById("message");

  let cartItems = [];
  let products = [];
  let total = 0;

  function showMessage(text, type = "error") {
    message.textContent = text;
    message.className = "message " + type;
  }

  function clearMessage() {
    message.textContent = "";
    message.className = "message";
  }

  async function loadCheckout() {

    try {

      const {
        data: {
          session
        }
      } = await supabase.auth.getSession();

      if (!session) {
        window.location.href = "login.html";
        return;
      }

      const userId = session.user.id;

      const {
        data: cartData,
        error: cartError
      } = await supabase
        .from("cart_items")
        .select("id, product_id, quantity")
        .eq("user_id", userId);

      if (cartError) {
        throw cartError;
      }

      if (!cartData || cartData.length === 0) {

        loading.style.display = "none";
        emptyCart.style.display = "block";

        return;
      }

      cartItems = cartData;

      const productIds = cartItems.map(
        item => item.product_id
      );

      const {
        data: productData,
        error: productError
      } = await supabase
        .from("products")
        .select("*")
        .in("id", productIds);

      if (productError) {
        throw productError;
      }

      products = productData || [];

      renderCart();

      loading.style.display = "none";
      checkout.style.display = "grid";

    } catch (error) {

      console.error(error);

      loading.style.display = "none";

      showMessage(
        "Unable to load your cart. Please try again.",
        "error"
      );

      checkout.style.display = "grid";
    }
  }

  function renderCart() {

    productList.innerHTML = "";

    total = 0;

    cartItems.forEach(item => {

      const product = products.find(
        p => Number(p.id) === Number(item.product_id)
      );

      if (!product) return;

      const quantity = Number(item.quantity) || 1;
      const price = Number(product.price) || 0;
      const itemTotal = price * quantity;

      total += itemTotal;

      const div = document.createElement("div");

      div.className = "product";

      div.innerHTML = `

        <img
          src="${product.image || "https://via.placeholder.com/100"}"
          alt="${escapeHtml(product.name)}"
        >

        <div class="product-info">

          <div class="product-name">
            ${escapeHtml(product.name)}
          </div>

          <div class="product-qty">
            Quantity: ${quantity}
          </div>

        </div>

        <div class="product-price">
          ${itemTotal.toFixed(2)} SEK
        </div>

      `;

      productList.appendChild(div);
    });

    subtotalEl.textContent =
      total.toFixed(2) + " SEK";

    totalEl.textContent =
      total.toFixed(2) + " SEK";
  }

  function escapeHtml(value) {

    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  payButton.addEventListener("click", async () => {

    clearMessage();

    const selected =
      document.querySelector(
        'input[name="payment"]:checked'
      );

    if (!selected) {

      showMessage(
        "Please choose a payment method."
      );

      return;
    }

    if (cartItems.length === 0) {

      showMessage(
        "Your cart is empty."
      );

      return;
    }

    payButton.disabled = true;
    payButton.textContent = "Processing...";

    try {

      if (selected.value === "stripe") {

        const items = cartItems
          .map(cartItem => {

            const product = products.find(
              p =>
                Number(p.id) ===
                Number(cartItem.product_id)
            );

            if (!product) return null;

            return {
              name: product.name,
              price: Number(product.price),
              quantity: Number(cartItem.quantity)
            };

          })
          .filter(Boolean);

        const response = await fetch(
          "/api/create-checkout-session",
          {
            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify({
              items
            })
          }
        );

        const contentType =
          response.headers.get("content-type") || "";

        if (!contentType.includes("application/json")) {
          throw new Error(
            "Stripe API did not return JSON. Check your Vercel API endpoint."
          );
        }

        const data = await response.json();

        if (!response.ok) {
          throw new Error(
            data.error ||
            "Stripe checkout failed."
          );
        }

        if (!data.url) {
          throw new Error(
            "Stripe checkout URL was not returned."
          );
        }

        window.location.href = data.url;

        return;
      }

      if (selected.value === "paypal") {

        const items = cartItems
          .map(cartItem => {

            const product = products.find(
              p =>
                Number(p.id) ===
                Number(cartItem.product_id)
            );

            if (!product) return null;

            return {
              product_id: product.id,
              name: product.name,
              price: Number(product.price),
              quantity: Number(cartItem.quantity)
            };

          })
          .filter(Boolean);

        const response = await fetch(
          "/api/paypal-create-order",
          {
            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify({
              items
            })
          }
        );

        const contentType =
          response.headers.get("content-type") || "";

        if (!contentType.includes("application/json")) {
          throw new Error(
            "PayPal API did not return JSON. Check your Vercel API endpoint."
          );
        }

        const data = await response.json();

        if (!response.ok) {
          throw new Error(
            data.error ||
            "PayPal checkout failed."
          );
        }

        if (!data.approvalUrl) {
          throw new Error(
            "PayPal approval URL was not returned."
          );
        }

        window.location.href =
          data.approvalUrl;

        return;
      }

      if (selected.value === "swish") {

        showMessage(
          "Swish payment is not connected yet. Stripe and PayPal are ready for the checkout flow.",
          "info"
        );

        payButton.disabled = false;
        payButton.textContent = "Pay Now";

        return;
      }

    } catch (error) {

      console.error(error);

      showMessage(
        error.message ||
        "Payment could not be started. Please try again.",
        "error"
      );

      payButton.disabled = false;
      payButton.textContent = "Pay Now";
    }

  });

  loadCheckout();

</script>

</body>
</html>
