<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Product Details | EB MARKETIZA</title>

  <meta
    name="description"
    content="View product details, photos, price and add products to your cart at EB MARKETIZA."
  />

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    nav {
      display: flex;
      gap: 15px;
      align-items: center;
      flex-wrap: wrap;
    }

    nav a {
      color: white;
      text-decoration: none;
    }

    main {
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 18px;
    }

    .back {
      display: inline-block;
      margin-bottom: 20px;
      color: #111;
      text-decoration: none;
      font-weight: bold;
    }

    .product-box {
      background: white;
      border-radius: 14px;
      padding: 25px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 35px;
      box-shadow: 0 4px 20px rgba(0,0,0,.08);
    }

    .gallery {
      width: 100%;
    }

    .main-image-box {
      width: 100%;
      height: 450px;
      background: #f3f3f3;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .main-image-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .thumbnails {
      display: flex;
      gap: 10px;
      margin-top: 12px;
      overflow-x: auto;
    }

    .thumbnail {
      width: 75px;
      height: 75px;
      border: 2px solid transparent;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      background: #eee;
      flex-shrink: 0;
    }

    .thumbnail.active {
      border-color: #111;
    }

    .thumbnail img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .no-image {
      color: #777;
      font-size: 18px;
      text-align: center;
      padding: 20px;
    }

    .details h2 {
      margin-top: 0;
      font-size: 32px;
    }

    .price {
      font-size: 28px;
      font-weight: bold;
      margin: 20px 0;
    }

    .description {
      line-height: 1.7;
      color: #555;
      white-space: pre-wrap;
    }

    .stock {
      margin: 15px 0;
      font-weight: bold;
    }

    .quantity-box {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 20px 0;
    }

    .quantity-box button {
      width: 38px;
      height: 38px;
      border: none;
      background: #111;
      color: white;
      border-radius: 6px;
      cursor: pointer;
      font-size: 20px;
    }

    #quantity {
      font-size: 18px;
      min-width: 30px;
      text-align: center;
    }

    #addToCart {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 8px;
      background: #111;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    #addToCart:hover {
      opacity: .9;
    }

    #addToCart:disabled {
      background: #999;
      cursor: not-allowed;
    }

    .message {
      background: #fff3cd;
      color: #664d03;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
    }

    .error {
      background: #f8d7da;
      color: #842029;
    }

    @media (max-width: 800px) {
      .product-box {
        grid-template-columns: 1fr;
      }

      .main-image-box {
        height: 350px;
      }

      .details h2 {
        font-size: 25px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>EB MARKETIZA</h1>

  <nav>
    <a href="./index.html">Home</a>
    <a href="./products.html">Products</a>
    <a href="./cart.html">Cart 🛒</a>
  </nav>
</header>

<main>

  <a class="back" href="./products.html">← Back to Products</a>

  <div id="message" class="message"></div>

  <div id="loading">
    Loading product...
  </div>

  <div id="productContainer" style="display:none;">

    <div class="product-box">

      <div class="gallery">

        <div class="main-image-box" id="mainImageBox">
          <div class="no-image">No image</div>
        </div>

        <div class="thumbnails" id="thumbnails"></div>

      </div>

      <div class="details">

        <h2 id="productName"></h2>

        <div class="price" id="productPrice"></div>

        <div class="stock" id="productStock"></div>

        <div class="description" id="productDescription"></div>

        <div class="quantity-box">

          <button id="minusBtn" type="button">−</button>

          <span id="quantity">1</span>

          <button id="plusBtn" type="button">+</button>

        </div>

        <button id="addToCart" type="button">
          Add to Cart
        </button>

      </div>

    </div>

  </div>

</main>

<script type="module">

  import { supabase } from "./supabaseClient.js";

  import {
    initMarketSelector,
    formatMoneyFromSEK
  } from "./market-config.js";


  /* =========================
     MARKET / CURRENCY
  ========================= */

  try {
    initMarketSelector();
  } catch (error) {
    console.warn("Market selector could not start:", error);
  }


  /* =========================
     GET PRODUCT ID
  ========================= */

  const params = new URLSearchParams(window.location.search);

  const productId = params.get("id");


  /* =========================
     ELEMENTS
  ========================= */

  const loading = document.getElementById("loading");
  const productContainer = document.getElementById("productContainer");
  const message = document.getElementById("message");

  const productName = document.getElementById("productName");
  const productPrice = document.getElementById("productPrice");
  const productStock = document.getElementById("productStock");
  const productDescription = document.getElementById("productDescription");

  const mainImageBox = document.getElementById("mainImageBox");
  const thumbnails = document.getElementById("thumbnails");

  const quantityElement = document.getElementById("quantity");

  const minusBtn = document.getElementById("minusBtn");
  const plusBtn = document.getElementById("plusBtn");

  const addToCart = document.getElementById("addToCart");


  let product = null;
  let productImages = [];
  let quantity = 1;


  /* =========================
     MESSAGE
  ========================= */

  function showMessage(text, isError = false) {

    message.textContent = text;

    message.className = isError
      ? "message error"
      : "message";

    message.style.display = "block";
  }


  /* =========================
     IMAGE URL
  ========================= */

  function getImageURL(row) {

    if (!row) return "";

    return (
      row.image_url ||
      row.public_url ||
      row.url ||
      row.image ||
      ""
    );
  }


  /* =========================
     SHOW MAIN IMAGE
  ========================= */

  function showMainImage(url) {

    mainImageBox.innerHTML = "";

    if (!url) {

      mainImageBox.innerHTML = `
        <div class="no-image">
          No image available
        </div>
      `;

      return;
    }

    const img = document.createElement("img");

    img.src = url;
    img.alt = product?.name || "Product";

    img.onerror = () => {

      mainImageBox.innerHTML = `
        <div class="no-image">
          Image could not be loaded
        </div>
      `;

    };

    mainImageBox.appendChild(img);
  }


  /* =========================
     SHOW THUMBNAILS
  ========================= */

  function renderThumbnails() {

    thumbnails.innerHTML = "";

    if (!productImages.length) return;

    productImages.forEach((image, index) => {

      const url = getImageURL(image);

      if (!url) return;

      const button = document.createElement("button");

      button.type = "button";
      button.className = "thumbnail";

      if (index === 0) {
        button.classList.add("active");
      }

      const img = document.createElement("img");

      img.src = url;
      img.alt = "Product image";

      img.onerror = () => {
        button.style.display = "none";
      };

      button.appendChild(img);

      button.addEventListener("click", () => {

        document
          .querySelectorAll(".thumbnail")
          .forEach(item => item.classList.remove("active"));

        button.classList.add("active");

        showMainImage(url);

      });

      thumbnails.appendChild(button);

    });

  }


  /* =========================
     PRODUCT IMAGE FALLBACK
  ========================= */

  function getFallbackProductImage() {

    if (!product) return "";

    return (
      product.image ||
      product.image_url ||
      product.public_url ||
      ""
    );

  }


  /* =========================
     LOAD PRODUCT
  ========================= */

  async function loadProduct() {

    try {

      console.log("Product ID:", productId);

      if (!productId) {

        throw new Error(
          "No product ID was found in the URL."
        );

      }


      /* =========================
         GET PRODUCT
      ========================= */

      const {
        data,
        error
      } = await supabase
        .from("products")
        .select("*")
        .eq("id", productId)
        .maybeSingle();


      console.log("Product result:", data);
      console.log("Product error:", error);


      if (error) {
        throw error;
      }


      if (!data) {

        throw new Error(
          "Product not found."
        );

      }


      product = data;


      /* =========================
         GET PRODUCT IMAGES
      ========================= */

      const {
        data: imageRows,
        error: imageError
      } = await supabase
        .from("product_images")
        .select("*")
        .eq("product_id", productId)
        .order("sort_order", {
          ascending: true
        });


      console.log(
        "Product images:",
        imageRows
      );

      console.log(
        "Product images error:",
        imageError
      );


      if (imageError) {

        console.warn(
          "Could not load product_images:",
          imageError
        );

        productImages = [];

      } else {

        productImages = Array.isArray(imageRows)
          ? imageRows.filter(row => getImageURL(row))
          : [];

      }


      /* =========================
         FALLBACK IMAGE
      ========================= */

      if (!productImages.length) {

        const fallback = getFallbackProductImage();

        if (fallback) {

          productImages = [
            {
              image_url: fallback
            }
          ];

        }

      }


      /* =========================
         PRODUCT INFORMATION
      ========================= */

      productName.textContent =
        product.name ||
        product.product_name ||
        "Unnamed Product";


      const priceSEK = Number(
        product.price_sek ??
        product.price ??
        0
      );


      try {

        productPrice.textContent =
          await formatMoneyFromSEK(priceSEK);

      } catch {

        productPrice.textContent =
          `${priceSEK} SEK`;

      }


      const stock = Number(
        product.stock ?? 0
      );


      productStock.textContent =
        stock > 0
          ? `In stock: ${stock}`
          : "Out of stock";


      productDescription.textContent =
        product.description ||
        "No description available.";


      /* =========================
         QUANTITY
      ========================= */

      quantity = 1;

      quantityElement.textContent =
        quantity;


      if (stock <= 0) {

        addToCart.disabled = true;
        addToCart.textContent =
          "Out of Stock";

        minusBtn.disabled = true;
        plusBtn.disabled = true;

      }


      /* =========================
         IMAGES
      ========================= */

      if (productImages.length) {

        showMainImage(
          getImageURL(productImages[0])
        );

        renderThumbnails();

      } else {

        showMainImage("");

      }


      /* =========================
         DISPLAY
      ========================= */

      loading.style.display = "none";

      productContainer.style.display =
        "block";


    } catch (error) {

      console.error(
        "PRODUCT LOAD ERROR:",
        error
      );

      loading.style.display = "none";

      showMessage(
        "Unable to load this product. Check the browser console for details.",
        true
      );

    }

  }


  /* =========================
     QUANTITY MINUS
  ========================= */

  minusBtn.addEventListener("click", () => {

    if (quantity > 1) {

      quantity--;

      quantityElement.textContent =
        quantity;

    }

  });


  /* =========================
     QUANTITY PLUS
  ========================= */

  plusBtn.addEventListener("click", () => {

    const stock = Number(
      product?.stock ?? 0
    );

    if (quantity < stock) {

      quantity++;

      quantityElement.textContent =
        quantity;

    }

  });


  /* =========================
     ADD TO CART
  ========================= */

  addToCart.addEventListener(
    "click",
    async () => {

      if (!product) return;

      try {

        const {
          data: {
            user
          }
        } = await supabase.auth.getUser();


        if (!user) {

          window.location.href =
            "./login.html";

          return;

        }


        const stock = Number(
          product.stock ?? 0
        );


        if (stock <= 0) {

          showMessage(
            "This product is out of stock.",
            true
          );

          return;

        }


        /* =========================
           CHECK EXISTING CART ITEM
        ========================= */

        const {
          data: existing,
          error: existingError
        } = await supabase
          .from("cart_items")
          .select("*")
          .eq("user_id", user.id)
          .eq("product_id", product.id)
          .maybeSingle();


        if (existingError) {

          console.error(
            existingError
          );

        }


        if (existing) {

          const newQuantity =
            Number(existing.quantity || 0)
            + quantity;


          if (newQuantity > stock) {

            showMessage(
              `Only ${stock} item(s) are available.`,
              true
            );

            return;

          }


          const {
            error
          } = await supabase
            .from("cart_items")
            .update({
              quantity: newQuantity
            })
            .eq("id", existing.id);


          if (error) throw error;


        } else {

          const {
            error
          } = await supabase
            .from("cart_items")
            .insert({

              user_id: user.id,

              product_id: product.id,

              quantity: quantity

            });


          if (error) throw error;

        }


        showMessage(
          "Product added to cart successfully."
        );


      } catch (error) {

        console.error(
          "ADD TO CART ERROR:",
          error
        );

        showMessage(
          error.message ||
          "Could not add product to cart.",
          true
        );

      }

    }
  );


  /* =========================
     START
  ========================= */

  loadProduct();

</script>

</body>
</html>
