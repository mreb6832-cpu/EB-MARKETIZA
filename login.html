<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login | E&B MARKETIZA</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 35px;
      border-radius: 18px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.12);
    }

    .logo {
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 28px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 10px;
      margin-bottom: 18px;
      font-size: 15px;
    }

    input:focus {
      outline: none;
      border-color: #111;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #111;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #333;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 18px;
      text-align: center;
      font-size: 14px;
      line-height: 1.5;
      word-break: break-word;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #555;
      text-decoration: none;
    }

    .back:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">
      E&B MARKETIZA
    </div>

    <div class="subtitle">
      Login to your account
    </div>

    <form id="loginForm">

      <label for="email">
        Email
      </label>

      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        autocomplete="email"
        required
      >

      <label for="password">
        Password
      </label>

      <input
        type="password"
        id="password"
        placeholder="Enter your password"
        autocomplete="current-password"
        required
      >

      <button
        type="submit"
        id="loginButton"
      >
        Login
      </button>

    </form>

    <div id="message"></div>

    <a
      href="index.html"
      class="back"
    >
      ← Back to Home
    </a>

  </div>


  <script type="module">

    import { auth } from "./firebase-config.js";

    import {
      signInWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


    /* =========================
       OWNER EMAIL
    ========================== */

    const OWNER_EMAIL =
      "mucyoemmy539@gmail.com";


    /* =========================
       ELEMENTS
    ========================== */

    const loginForm =
      document.getElementById("loginForm");

    const loginButton =
      document.getElementById("loginButton");

    const message =
      document.getElementById("message");


    /* =========================
       LOGIN
    ========================== */

    loginForm.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();


        const email =
          document
            .getElementById("email")
            .value
            .trim();

        const password =
          document
            .getElementById("password")
            .value;


        message.textContent = "";

        loginButton.disabled = true;
        loginButton.textContent =
          "Logging in...";


        try {

          const userCredential =
            await signInWithEmailAndPassword(
              auth,
              email,
              password
            );


          const user =
            userCredential.user;


          /* =========================
             OWNER LOGIN
          ========================== */

          if (
            user.email &&
            user.email.toLowerCase() ===
            OWNER_EMAIL.toLowerCase()
          ) {

            message.style.color = "green";

            message.textContent =
              "Login successful. Opening Admin Dashboard...";


            setTimeout(() => {

              window.location.href =
                "admin.html";

            }, 700);


          }

          /* =========================
             CUSTOMER LOGIN
          ========================== */

          else {

            message.style.color = "green";

            message.textContent =
              "Login successful.";


            setTimeout(() => {

              window.location.href =
                "account.html";

            }, 700);

          }


        } catch (error) {

          /* =========================
             FIREBASE ERROR
          ========================== */

          console.error(
            "LOGIN ERROR:",
            error
          );

          console.error(
            "ERROR CODE:",
            error.code
          );

          console.error(
            "ERROR MESSAGE:",
            error.message
          );


          message.style.color = "red";


          /*
             Show the real Firebase error
             instead of hiding it.
          */

          message.textContent =
            error.code +
            " — " +
            error.message;


        } finally {

          loginButton.disabled = false;

          loginButton.textContent =
            "Login";

        }

      }
    );

  </script>

</body>
</html>
