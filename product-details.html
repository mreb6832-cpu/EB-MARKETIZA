<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Product Details | EB MARKETIZA</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #111;
    }

    header {
      background: #111;
      color: white;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    nav {
      display: flex;
      gap: 18px;
    }

    nav a {
      color: white;
      text-decoration: none;
    }

    main {
      max-width: 1150px;
      margin: 30px auto;
      padding: 0 18px;
    }

    .back {
      display: inline-block;
      margin-bottom: 20px;
      color: #111;
      text-decoration: none;
      font-weight: bold;
    }

    #loading {
      background: white;
      padding: 30px;
      border-radius: 12px;
      text-align: center;
    }

    #error {
      display: none;
      background: #ffe5e5;
      color: #b00020;
      padding: 18px;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    #product {
      display: none;
      background: white;
      border-radius: 16px;
      padding: 25px;
      box-shadow: 0 5px 25px rgba(0,0,0,.08);
      grid-template-columns: 1fr 1fr;
      gap: 35px;
    }

    .gallery {
      width: 100%;
    }

    .main-image {
      width: 100%;
      height: 480px;
      background: #f1f1f1;
      border-radius: 14px;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .main-image img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .no-image {
      color: #777;
      font-size: 18px;
    }

    .thumbnails {
      display: flex;
      gap: 10px;
      margin-top: 12px;
      overflow-x: auto;
    }

    .thumbnail {
      width: 75px;
      height: 75px;
      border: 2px solid transparent;
      border-radius: 8px;
      padding: 0;
      overflow: hidden;
      cursor: pointer;
      background: #eee;
      flex-shrink: 0;
    }

    .thumbnail.active {
      border-color: #111;
    }

    .thumbnail img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .details h2 {
      margin-top: 0;
      font-size: 32px;
    }

    .price {
      font-size: 28px;
      font-weight: bold;
      margin: 20px 0;
    }

    .stock {
      font-weight: bold;
      margin-bottom: 20px;
    }

    .description {
      line-height: 1.7;
      color: #555;
      white-space: pre-wrap;
    }

    .quantity {
      display: flex;
      align-items: center;
      gap: 15px;
      margin: 25px 0;
    }

    .quantity button {
      width: 40px;
      height: 40px;
      border: none;
      background: #111;
      color: white;
      border-radius: 7px;
      font-size: 20px;
      cursor: pointer;
    }

    #quantityValue {
      min-width: 30px;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
    }

    #addToCart {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 8px;
      background: #111;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    #addToCart:disabled {
      background: #999;
      cursor: not-allowed;
    }

    #cartMessage {
      display: none;
      margin-top: 15px;
      padding: 14px;
      border-radius: 8px;
      background: #e8f7e8;
      color: #176b17;
    }

    @media (max-width: 800px) {
      #product {
        grid-template-columns: 1fr;
      }

      .main-image {
        height: 350px;
      }

      .details h2 {
        font-size: 25px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>EB MARKETIZA</h1>

  <nav>
    <a href="./index.html">Home</a>
    <a href="./products.html">Products</a>
    <a href="./cart.html">🛒 Cart</a>
  </nav>
</header>

<main>

  <a class="back" href="./products.html">
    ← Back to Products
  </a>

  <div id="loading">
    Loading product...
  </div>

  <div id="error"></div>

  <section id="product">

    <div class="gallery">

      <div class="main-image" id="mainImage">
        <span class="no-image">No image</span>
      </div>

      <div class="thumbnails" id="thumbnails"></div>

    </div>

    <div class="details">

      <h2 id="name"></h2>

      <div class="price" id="price"></div>

      <div class="stock" id="stock"></div>

      <div class="description" id="description"></div>

      <div class="quantity">

        <button id="minus" type="button">−</button>

        <span id="quantityValue">1</span>

        <button id="plus" type="button">+</button>

      </div>

      <button id="addToCart" type="button">
        Add to Cart
      </button>

      <div id="cartMessage"></div>

    </div>

  </section>

</main>

<script type="module">

  import { supabase } from "./supabaseClient.js";


  /* ==========================================
     PRODUCT ID
  ========================================== */

  const params = new URLSearchParams(
    window.location.search
  );

  const productId = params.get("id");


  /* ==========================================
     ELEMENTS
  ========================================== */

  const loading =
    document.getElementById("loading");

  const errorBox =
    document.getElementById("error");

  const productBox =
    document.getElementById("product");

  const nameElement =
    document.getElementById("name");

  const priceElement =
    document.getElementById("price");

  const stockElement =
    document.getElementById("stock");

  const descriptionElement =
    document.getElementById("description");

  const mainImage =
    document.getElementById("mainImage");

  const thumbnails =
    document.getElementById("thumbnails");

  const quantityValue =
    document.getElementById("quantityValue");

  const minus =
    document.getElementById("minus");

  const plus =
    document.getElementById("plus");

  const addToCart =
    document.getElementById("addToCart");

  const cartMessage =
    document.getElementById("cartMessage");


  let currentProduct = null;

  let quantity = 1;

  let images = [];


  /* ==========================================
     ERROR
  ========================================== */

  function showError(message) {

    loading.style.display = "none";

    productBox.style.display = "none";

    errorBox.style.display = "block";

    errorBox.textContent = message;

  }


  /* ==========================================
     MONEY
  ========================================== */

  function formatPrice(value) {

    const number = Number(value || 0);

    return new Intl.NumberFormat(
      "sv-SE",
      {
        style: "currency",
        currency: "SEK"
      }
    ).format(number);

  }


  /* ==========================================
     IMAGE URL
  ========================================== */

  function imageURL(row) {

    if (!row) return "";

    return (
      row.image_url ||
      row.public_url ||
      row.url ||
      row.image ||
      ""
    );

  }


  /* ==========================================
     SHOW MAIN IMAGE
  ========================================== */

  function showMainImage(url) {

    mainImage.innerHTML = "";

    if (!url) {

      mainImage.innerHTML =
        `<span class="no-image">No image available</span>`;

      return;

    }

    const img =
      document.createElement("img");

    img.src = url;

    img.alt =
      currentProduct?.name || "Product";

    img.onerror = function () {

      mainImage.innerHTML =
        `<span class="no-image">Image unavailable</span>`;

    };

    mainImage.appendChild(img);

  }


  /* ==========================================
     THUMBNAILS
  ========================================== */

  function renderThumbnails() {

    thumbnails.innerHTML = "";

    images.forEach((row, index) => {

      const url = imageURL(row);

      if (!url) return;

      const button =
        document.createElement("button");

      button.type = "button";

      button.className = "thumbnail";

      if (index === 0) {

        button.classList.add("active");

      }

      const img =
        document.createElement("img");

      img.src = url;

      img.alt = "Product image";

      img.onerror = function () {

        button.remove();

      };

      button.appendChild(img);

      button.addEventListener(
        "click",
        function () {

          document
            .querySelectorAll(".thumbnail")
            .forEach(
              item =>
                item.classList.remove("active")
            );

          button.classList.add("active");

          showMainImage(url);

        }
      );

      thumbnails.appendChild(button);

    });

  }


  /* ==========================================
     LOAD PRODUCT
  ========================================== */

  async function loadProduct() {

    try {

      console.log(
        "EB MARKETIZA product ID:",
        productId
      );

      if (!productId) {

        throw new Error(
          "Product ID is missing from the URL."
        );

      }


      /* ======================================
         PRODUCT
      ====================================== */

      const {
        data: productData,
        error: productError
      } = await supabase
        .from("products")
        .select("*")
        .eq("id", productId)
        .maybeSingle();


      console.log(
        "PRODUCT:",
        productData
      );

      console.log(
        "PRODUCT ERROR:",
        productError
      );


      if (productError) {

        throw new Error(
          productError.message
        );

      }


      if (!productData) {

        throw new Error(
          "Product was not found."
        );

      }


      currentProduct =
        productData;


      /* ======================================
         PRODUCT IMAGES
      ====================================== */

      const {
        data: imageData,
        error: imageError
      } = await supabase
        .from("product_images")
        .select("*")
        .eq("product_id", productId)
        .order(
          "sort_order",
          {
            ascending: true
          }
        );


      console.log(
        "PRODUCT IMAGES:",
        imageData
      );

      console.log(
        "IMAGE ERROR:",
        imageError
      );


      if (imageError) {

        console.warn(
          "product_images error:",
          imageError
        );

        images = [];

      } else {

        images =
          Array.isArray(imageData)
            ? imageData.filter(
                row => imageURL(row)
              )
            : [];

      }


      /* ======================================
         FALLBACK TO products.image
      ====================================== */

      if (images.length === 0) {

        const fallback =
          currentProduct.image ||
          currentProduct.image_url ||
          currentProduct.public_url ||
          "";

        if (fallback) {

          images = [
            {
              image_url: fallback
            }
          ];

        }

      }


      /* ======================================
         DISPLAY DATA
      ====================================== */

      nameElement.textContent =
        currentProduct.name ||
        "Unnamed Product";


      priceElement.textContent =
        formatPrice(
          currentProduct.price
        );


      const stock =
        Number(
          currentProduct.stock || 0
        );


      stockElement.textContent =
        stock > 0
          ? `In stock: ${stock}`
          : "Out of stock";


      descriptionElement.textContent =
        currentProduct.description ||
        "No description available.";


      /* ======================================
         IMAGES
      ====================================== */

      if (images.length > 0) {

        showMainImage(
          imageURL(images[0])
        );

        renderThumbnails();

      } else {

        showMainImage("");

      }


      /* ======================================
         STOCK
      ====================================== */

      if (stock <= 0) {

        addToCart.disabled = true;

        addToCart.textContent =
          "Out of Stock";

        plus.disabled = true;

        minus.disabled = true;

      }


      /* ======================================
         SHOW PAGE
      ====================================== */

      loading.style.display =
        "none";

      errorBox.style.display =
        "none";

      productBox.style.display =
        "grid";


    } catch (error) {

      console.error(
        "LOAD PRODUCT ERROR:",
        error
      );

      showError(
        "Product could not be loaded: " +
        error.message
      );

    }

  }


  /* ==========================================
     QUANTITY -
  ========================================== */

  minus.addEventListener(
    "click",
    function () {

      if (quantity > 1) {

        quantity--;

        quantityValue.textContent =
          quantity;

      }

    }
  );


  /* ==========================================
     QUANTITY +
  ========================================== */

  plus.addEventListener(
    "click",
    function () {

      const stock =
        Number(
          currentProduct?.stock || 0
        );

      if (quantity < stock) {

        quantity++;

        quantityValue.textContent =
          quantity;

      }

    }
  );


  /* ==========================================
     ADD TO CART
  ========================================== */

  addToCart.addEventListener(
    "click",
    async function () {

      try {

        if (!currentProduct) return;


        const {
          data: {
            user
          }
        } =
          await supabase.auth.getUser();


        if (!user) {

          window.location.href =
            "./login.html";

          return;

        }


        const {
          data: existing,
          error: existingError
        } =
          await supabase
            .from("cart_items")
            .select("*")
            .eq(
              "user_id",
              user.id
            )
            .eq(
              "product_id",
              currentProduct.id
            )
            .maybeSingle();


        if (existingError) {

          throw new Error(
            existingError.message
          );

        }


        if (existing) {

          const newQuantity =
            Number(existing.quantity || 0)
            + quantity;


          if (
            newQuantity >
            Number(currentProduct.stock || 0)
          ) {

            throw new Error(
              "Not enough stock available."
            );

          }


          const {
            error
          } =
            await supabase
              .from("cart_items")
              .update({
                quantity: newQuantity
              })
              .eq(
                "id",
                existing.id
              );


          if (error) {

            throw new Error(
              error.message
            );

          }

        } else {

          const {
            error
          } =
            await supabase
              .from("cart_items")
              .insert({

                user_id: user.id,

                product_id:
                  currentProduct.id,

                quantity: quantity

              });


          if (error) {

            throw new Error(
              error.message
            );

          }

        }


        cartMessage.style.display =
          "block";

        cartMessage.textContent =
          "Product added to cart successfully.";

      } catch (error) {

        console.error(
          "ADD CART ERROR:",
          error
        );

        cartMessage.style.display =
          "block";

        cartMessage.style.background =
          "#ffe5e5";

        cartMessage.style.color =
          "#b00020";

        cartMessage.textContent =
          error.message ||
          "Could not add product to cart.";

      }

    }
  );


  /* ==========================================
     START
  ========================================== */

  loadProduct();

</script>

</body>
</html>
