<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cart | EB MARKETIZA</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #111827;
    }

    nav {
      background: #111827;
      color: white;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 15px;
    }

    .container {
      max-width: 1100px;
      margin: 40px auto;
      padding: 20px;
    }

    h1 {
      margin-bottom: 25px;
    }

    .cart-layout {
      display: grid;
      grid-template-columns: 1fr 350px;
      gap: 25px;
    }

    .cart-list,
    .summary {
      background: white;
      border-radius: 15px;
      padding: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,.07);
    }

    .cart-item {
      display: grid;
      grid-template-columns: 100px 1fr auto;
      gap: 18px;
      align-items: center;
      padding: 15px 0;
      border-bottom: 1px solid #e5e7eb;
    }

    .cart-item:last-child {
      border-bottom: none;
    }

    .cart-image {
      width: 100px;
      height: 100px;
      object-fit: contain;
      border-radius: 10px;
      background: #f3f4f6;
    }

    .product-name {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .price {
      color: #2563eb;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .quantity {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .quantity button {
      width: 32px;
      height: 32px;
      border: none;
      background: #e5e7eb;
      border-radius: 7px;
      cursor: pointer;
      font-size: 18px;
    }

    .quantity span {
      min-width: 25px;
      text-align: center;
      font-weight: bold;
    }

    .remove {
      border: none;
      background: #fee2e2;
      color: #dc2626;
      padding: 9px 12px;
      border-radius: 7px;
      cursor: pointer;
      margin-top: 10px;
    }

    .summary h2 {
      margin-bottom: 20px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      margin: 15px 0;
    }

    .total {
      border-top: 1px solid #e5e7eb;
      padding-top: 18px;
      font-size: 20px;
      font-weight: bold;
    }

    .checkout {
      width: 100%;
      border: none;
      padding: 15px;
      margin-top: 20px;
      background: #2563eb;
      color: white;
      border-radius: 9px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .checkout:hover {
      background: #1d4ed8;
    }

    .empty {
      text-align: center;
      padding: 60px 20px;
    }

    .empty a {
      display: inline-block;
      margin-top: 20px;
      background: #2563eb;
      color: white;
      text-decoration: none;
      padding: 12px 20px;
      border-radius: 8px;
    }

    .error {
      text-align: center;
      color: #dc2626;
      padding: 30px;
    }

    @media (max-width: 750px) {
      .cart-layout {
        grid-template-columns: 1fr;
      }

      .cart-item {
        grid-template-columns: 75px 1fr;
      }

      .cart-image {
        width: 75px;
        height: 75px;
      }

      .cart-actions {
        grid-column: 1 / -1;
      }

      nav {
        flex-direction: column;
        gap: 12px;
      }
    }
  </style>
</head>

<body>

<nav>
  <div class="logo">EB MARKETIZA</div>

  <div>
    <a href="index.html">Home</a>
    <a href="products.html">Products</a>
    <a href="account.html">Account</a>
  </div>
</nav>

<div class="container">

  <h1>🛒 My Cart</h1>

  <div id="content">
    Loading cart...
  </div>

</div>


<script type="module">

import { supabase } from "./supabaseClient.js";

const content = document.getElementById("content");

let cartItems = [];


/* =========================
   LOAD CART
========================= */

async function loadCart() {

  const {
    data: {
      session
    }
  } = await supabase.auth.getSession();


  if (!session) {

    content.innerHTML = `
      <div class="empty">

        <h2>Please login first</h2>

        <p>
          You need to login to view your cart.
        </p>

        <a href="login.html">
          Login
        </a>

      </div>
    `;

    return;
  }


  const {
    data,
    error
  } = await supabase
    .from("cart_items")
    .select(`
      id,
      quantity,
      product_id,
      products (
        id,
        name,
        price,
        image,
        stock
      )
    `)
    .eq("user_id", session.user.id)
    .order("created_at", {
      ascending: false
    });


  if (error) {

    console.error(error);

    content.innerHTML = `
      <div class="error">
        Could not load your cart.
      </div>
    `;

    return;
  }


  cartItems = data || [];

  renderCart();
}


/* =========================
   RENDER CART
========================= */

function renderCart() {

  if (cartItems.length === 0) {

    content.innerHTML = `
      <div class="empty">

        <h2>Your cart is empty</h2>

        <p>
          Add some products to your cart.
        </p>

        <a href="products.html">
          Browse Products
        </a>

      </div>
    `;

    return;
  }


  let subtotal = 0;


  const itemsHTML = cartItems.map(item => {

    const product = item.products;

    if (!product) return "";


    const price = Number(product.price);

    const quantity = Number(item.quantity);

    const itemTotal = price * quantity;

    subtotal += itemTotal;


    return `
      <div class="cart-item">

        <img
          class="cart-image"
          src="${escapeHtml(product.image || "")}"
          alt="${escapeHtml(product.name)}"
        >


        <div>

          <div class="product-name">
            ${escapeHtml(product.name)}
          </div>

          <div class="price">
            ${price.toFixed(2)} SEK
          </div>


          <div class="quantity">

            <button
              onclick="changeQuantity(
                ${item.id},
                ${quantity - 1},
                ${product.stock}
              )"
            >
              −
            </button>

            <span>
              ${quantity}
            </span>

            <button
              onclick="changeQuantity(
                ${item.id},
                ${quantity + 1},
                ${product.stock}
              )"
            >
              +
            </button>

          </div>

        </div>


        <div class="cart-actions">

          <strong>
            ${itemTotal.toFixed(2)} SEK
          </strong>

          <br>

          <button
            class="remove"
            onclick="removeItem(${item.id})"
          >
            🗑️ Remove
          </button>

        </div>

      </div>
    `;

  }).join("");


  const delivery = 0;

  const total = subtotal + delivery;


  content.innerHTML = `

    <div class="cart-layout">


      <div class="cart-list">

        ${itemsHTML}

      </div>


      <div class="summary">

        <h2>Order Summary</h2>


        <div class="summary-row">

          <span>Subtotal</span>

          <strong>
            ${subtotal.toFixed(2)} SEK
          </strong>

        </div>


        <div class="summary-row">

          <span>Delivery</span>

          <strong>
            FREE
          </strong>

        </div>


        <div class="summary-row total">

          <span>Total</span>

          <span>
            ${total.toFixed(2)} SEK
          </span>

        </div>


        <button
          class="checkout"
          onclick="goToCheckout()"
        >
          Proceed to Checkout
        </button>

      </div>

    </div>
  `;
}


/* =========================
   CHANGE QUANTITY
========================= */

window.changeQuantity = async function(
  itemId,
  newQuantity,
  stock
) {

  if (newQuantity < 1) {
    await removeItem(itemId);
    return;
  }


  if (newQuantity > Number(stock)) {

    alert(
      `Only ${stock} item(s) available in stock.`
    );

    return;
  }


  const {
    error
  } = await supabase
    .from("cart_items")
    .update({
      quantity: newQuantity
    })
    .eq("id", itemId);


  if (error) {

    console.error(error);

    alert(
      "Could not update quantity."
    );

    return;
  }


  await loadCart();
};


/* =========================
   REMOVE ITEM
========================= */

window.removeItem = async function(itemId) {

  const {
    error
  } = await supabase
    .from("cart_items")
    .delete()
    .eq("id", itemId);


  if (error) {

    console.error(error);

    alert(
      "Could not remove product."
    );

    return;
  }


  await loadCart();
};


/* =========================
   CHECKOUT
========================= */

window.goToCheckout = function() {

  if (cartItems.length === 0) {
    return;
  }

  window.location.href = "payment.html";
};


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value) {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}


/* START */

loadCart();

</script>

</body>
</html>
