<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Product Details | EB MARKETIZA</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #111827;
    }

    nav {
      background: #111827;
      color: white;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 15px;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
    }

    .container {
      max-width: 1100px;
      margin: 40px auto;
      padding: 20px;
    }

    .back {
      display: inline-block;
      margin-bottom: 20px;
      color: #2563eb;
      text-decoration: none;
    }

    .product {
      background: white;
      border-radius: 16px;
      padding: 25px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 35px;
      box-shadow: 0 5px 20px rgba(0,0,0,.08);
    }

    .main-image {
      width: 100%;
      height: 450px;
      object-fit: contain;
      border-radius: 12px;
      background: #f3f4f6;
    }

    .gallery {
      display: flex;
      gap: 10px;
      margin-top: 15px;
      overflow-x: auto;
    }

    .thumb {
      width: 75px;
      height: 75px;
      object-fit: cover;
      border-radius: 8px;
      cursor: pointer;
      border: 2px solid transparent;
    }

    .thumb:hover {
      border-color: #2563eb;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 15px;
    }

    .price {
      font-size: 28px;
      font-weight: bold;
      color: #2563eb;
      margin: 20px 0;
    }

    .category {
      display: inline-block;
      background: #e5edff;
      color: #2563eb;
      padding: 7px 12px;
      border-radius: 20px;
      margin-bottom: 20px;
    }

    .description {
      line-height: 1.7;
      color: #4b5563;
      margin-bottom: 20px;
      white-space: pre-wrap;
    }

    .stock {
      margin-bottom: 20px;
      font-weight: bold;
    }

    .quantity {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .quantity button {
      width: 38px;
      height: 38px;
      border: none;
      background: #e5e7eb;
      border-radius: 8px;
      font-size: 20px;
      cursor: pointer;
    }

    .quantity span {
      font-size: 18px;
      font-weight: bold;
    }

    .add-cart {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .add-cart:hover {
      background: #1d4ed8;
    }

    .message {
      text-align: center;
      padding: 50px 20px;
    }

    .error {
      color: #dc2626;
    }

    @media (max-width: 700px) {
      .product {
        grid-template-columns: 1fr;
      }

      .main-image {
        height: 330px;
      }

      h1 {
        font-size: 26px;
      }

      nav {
        flex-direction: column;
        gap: 12px;
      }
    }
  </style>
</head>

<body>

<nav>
  <div class="logo">EB MARKETIZA</div>

  <div>
    <a href="index.html">Home</a>
    <a href="products.html">Products</a>
    <a href="cart.html">Cart 🛒</a>
  </div>
</nav>

<div class="container">

  <a href="products.html" class="back">
    ← Back to Products
  </a>

  <div id="message" class="message">
    Loading product...
  </div>

  <div id="productContainer"></div>

</div>

<script type="module">

import { supabase } from "./supabaseClient.js";

const params = new URLSearchParams(window.location.search);
const productId = params.get("id");

const message = document.getElementById("message");
const productContainer = document.getElementById("productContainer");

let product = null;
let images = [];
let quantity = 1;


/* =========================
   LOAD PRODUCT
========================= */

async function loadProduct() {

  if (!productId) {
    message.innerHTML = `
      <div class="error">
        Product not found.
      </div>
    `;
    return;
  }

  const { data, error } = await supabase
    .from("products")
    .select("*")
    .eq("id", productId)
    .single();

  if (error) {
    console.error(error);

    message.innerHTML = `
      <div class="error">
        Could not load product.
      </div>
    `;

    return;
  }

  product = data;


  /* Load product images */

  const { data: imageData, error: imageError } =
    await supabase
      .from("product_images")
      .select("*")
      .eq("product_id", productId)
      .order("sort_order", {
        ascending: true
      });


  if (!imageError && imageData) {
    images = imageData;
  }


  renderProduct();
}


/* =========================
   DISPLAY PRODUCT
========================= */

function renderProduct() {

  message.style.display = "none";

  let mainImage = product.image || "";

  if (images.length > 0) {
    mainImage = images[0].image_url;
  }


  const gallery = images.length
    ? images.map(img => `
        <img
          src="${escapeHtml(img.image_url)}"
          class="thumb"
          onclick="changeImage('${escapeHtml(img.image_url)}')"
          alt="Product image"
        >
      `).join("")
    : "";


  productContainer.innerHTML = `

    <div class="product">

      <div>

        <img
          id="mainImage"
          src="${escapeHtml(mainImage)}"
          class="main-image"
          alt="${escapeHtml(product.name)}"
        >

        <div class="gallery">
          ${gallery}
        </div>

      </div>


      <div>

        <span class="category">
          ${escapeHtml(product.category || "General")}
        </span>

        <h1>
          ${escapeHtml(product.name)}
        </h1>

        <div class="price">
          ${Number(product.price).toFixed(2)} SEK
        </div>

        <div class="description">
          ${escapeHtml(
            product.description ||
            "No description available."
          )}
        </div>

        <div class="stock">
          ${
            Number(product.stock) > 0
              ? `In stock: ${product.stock}`
              : "Out of stock"
          }
        </div>


        ${
          Number(product.stock) > 0
          ? `

            <div class="quantity">

              <button onclick="changeQuantity(-1)">
                −
              </button>

              <span id="quantity">
                1
              </span>

              <button onclick="changeQuantity(1)">
                +
              </button>

            </div>

            <button
              class="add-cart"
              id="addCartButton"
              onclick="addToCart()"
            >
              🛒 Add to Cart
            </button>

          `
          : `

            <button
              class="add-cart"
              disabled
            >
              Out of Stock
            </button>

          `
        }

      </div>

    </div>
  `;
}


/* =========================
   CHANGE MAIN IMAGE
========================= */

window.changeImage = function(url) {

  const mainImage =
    document.getElementById("mainImage");

  if (mainImage) {
    mainImage.src = url;
  }
};


/* =========================
   CHANGE QUANTITY
========================= */

window.changeQuantity = function(change) {

  if (!product) return;

  const max = Number(product.stock);

  quantity += change;

  if (quantity < 1) {
    quantity = 1;
  }

  if (quantity > max) {
    quantity = max;
  }

  const quantityElement =
    document.getElementById("quantity");

  if (quantityElement) {
    quantityElement.textContent = quantity;
  }
};


/* =========================
   ADD TO SUPABASE CART
========================= */

window.addToCart = async function() {

  if (!product) return;


  /* Check login */

  const {
    data: {
      session
    }
  } = await supabase.auth.getSession();


  if (!session) {

    alert("Please login before adding products to your cart.");

    window.location.href =
      "login.html?redirect=" +
      encodeURIComponent(
        window.location.pathname +
        window.location.search
      );

    return;
  }


  const userId = session.user.id;


  /* Check existing cart item */

  const {
    data: existing,
    error: existingError
  } = await supabase
    .from("cart_items")
    .select("*")
    .eq("user_id", userId)
    .eq("product_id", product.id)
    .maybeSingle();


  if (existingError) {

    console.error(existingError);

    alert(
      "Could not check your cart. Please try again."
    );

    return;
  }


  let result;


  /* Existing item */

  if (existing) {

    let newQuantity =
      Number(existing.quantity) + quantity;


    if (newQuantity > Number(product.stock)) {
      newQuantity = Number(product.stock);
    }


    result = await supabase
      .from("cart_items")
      .update({
        quantity: newQuantity
      })
      .eq("id", existing.id)
      .eq("user_id", userId);

  }


  /* New item */

  else {

    result = await supabase
      .from("cart_items")
      .insert({
        user_id: userId,
        product_id: product.id,
        quantity: quantity
      });

  }


  if (result.error) {

    console.error(result.error);

    alert(
      "Could not add product to cart."
    );

    return;
  }


  alert("Product added to your cart 🛒");

  quantity = 1;

  const quantityElement =
    document.getElementById("quantity");

  if (quantityElement) {
    quantityElement.textContent = "1";
  }
};


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value) {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}


/* START */

loadProduct();

</script>

</body>
</html>
