<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login | E&B MARKETIZA</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 35px;
      border-radius: 18px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.12);
    }

    .logo {
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 28px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 10px;
      margin-bottom: 18px;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #111;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #333;
    }

    #message {
      margin-top: 18px;
      text-align: center;
      font-size: 14px;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #555;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">E&B MARKETIZA</div>

    <div class="subtitle">
      Login to your account
    </div>

    <form id="loginForm">

      <label for="email">Email</label>

      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        required
      >

      <label for="password">Password</label>

      <input
        type="password"
        id="password"
        placeholder="Enter your password"
        required
      >

      <button type="submit" id="loginButton">
        Login
      </button>

    </form>

    <div id="message"></div>

    <a href="index.html" class="back">
      ← Back to Home
    </a>

  </div>

  <script type="module">

    import { auth } from "./firebase-config.js";

    import {
      signInWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


    const OWNER_EMAIL =
      "mucyoemmy539@gmail.com";


    const loginForm =
      document.getElementById("loginForm");

    const loginButton =
      document.getElementById("loginButton");

    const message =
      document.getElementById("message");


    loginForm.addEventListener("submit", async (event) => {

      event.preventDefault();

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;


      message.textContent = "";

      loginButton.disabled = true;
      loginButton.textContent = "Logging in...";


      try {

        const userCredential =
          await signInWithEmailAndPassword(
            auth,
            email,
            password
          );


        const user =
          userCredential.user;


        if (
          user.email &&
          user.email.toLowerCase() ===
          OWNER_EMAIL.toLowerCase()
        ) {

          message.style.color = "green";
          message.textContent =
            "Login successful. Opening Admin Dashboard...";

          setTimeout(() => {
            window.location.href = "admin.html";
          }, 700);

        } else {

          message.style.color = "green";
          message.textContent =
            "Login successful.";

          setTimeout(() => {
            window.location.href = "account.html";
          }, 700);

        }

      } catch (error) {

        console.error(error);

        message.style.color = "red";

        if (error.code === "auth/invalid-credential") {

          message.textContent =
            "Incorrect email or password.";

        } else if (error.code === "auth/user-not-found") {

          message.textContent =
            "Account not found.";

        } else if (error.code === "auth/wrong-password") {

          message.textContent =
            "Incorrect password.";

        } else {

          message.textContent =
            "Login failed. Please try again.";

        }

      } finally {

        loginButton.disabled = false;
        loginButton.textContent = "Login";

      }

    });

  </script>

</body>
</html>
