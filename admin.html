<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EB MARKETIZA — Owner Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f6f8;
  color:#222;
}

header{
  background:#111;
  color:#fff;
  padding:18px 22px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  position:sticky;
  top:0;
  z-index:50;
}

.logo{
  font-size:22px;
  font-weight:800;
}

.header-right{
  display:flex;
  align-items:center;
  gap:10px;
}

.admin-email{
  font-size:13px;
  opacity:.8;
}

button,
.btn{
  border:0;
  border-radius:8px;
  padding:11px 15px;
  cursor:pointer;
  font-weight:700;
}

.logout-btn{
  background:#fff;
  color:#111;
}

.container{
  width:min(1200px,94%);
  margin:25px auto;
}

h1{
  margin-bottom:20px;
}

h2{
  margin-bottom:15px;
}

.dashboard-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-bottom:25px;
}

.card{
  background:#fff;
  border-radius:14px;
  padding:20px;
  box-shadow:0 3px 15px rgba(0,0,0,.06);
}

.stat-title{
  color:#777;
  font-size:14px;
  margin-bottom:8px;
}

.stat-value{
  font-size:28px;
  font-weight:800;
}

.section{
  background:#fff;
  border-radius:14px;
  padding:20px;
  margin-bottom:25px;
  box-shadow:0 3px 15px rgba(0,0,0,.06);
}

.form-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

.form-group{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.form-group.full{
  grid-column:1/-1;
}

label{
  font-weight:700;
  font-size:14px;
}

input,
textarea,
select{
  width:100%;
  border:1px solid #ddd;
  border-radius:8px;
  padding:12px;
  font-size:15px;
  outline:none;
}

input:focus,
textarea:focus,
select:focus{
  border-color:#ff5a00;
}

textarea{
  min-height:100px;
  resize:vertical;
}

.primary{
  background:#ff5a00;
  color:#fff;
}

.secondary{
  background:#eee;
  color:#222;
}

.danger{
  background:#dc3545;
  color:#fff;
}

.success{
  background:#198754;
  color:#fff;
}

.products-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
}

.product-card{
  border:1px solid #eee;
  border-radius:12px;
  overflow:hidden;
  background:#fff;
}

.product-card img{
  width:100%;
  height:190px;
  object-fit:cover;
  background:#eee;
}

.product-info{
  padding:13px;
}

.product-name{
  font-weight:800;
  margin-bottom:6px;
}

.product-price{
  font-weight:800;
  color:#ff5a00;
  margin-bottom:5px;
}

.product-stock{
  color:#666;
  font-size:13px;
  margin-bottom:12px;
}

.product-actions{
  display:flex;
  gap:7px;
}

.product-actions button{
  flex:1;
  padding:9px;
  font-size:12px;
}

.table-wrap{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:850px;
}

th,
td{
  padding:13px 10px;
  border-bottom:1px solid #eee;
  text-align:left;
  font-size:14px;
}

th{
  background:#fafafa;
}

.status{
  display:inline-block;
  padding:6px 9px;
  border-radius:20px;
  font-size:12px;
  font-weight:800;
}

.status-paid{
  background:#d1fae5;
  color:#065f46;
}

.status-pending{
  background:#fff3cd;
  color:#856404;
}

.status-failed{
  background:#fee2e2;
  color:#991b1b;
}

.status-refunded{
  background:#e5e7eb;
  color:#374151;
}

.status-new{
  background:#dbeafe;
  color:#1e40af;
}

.status-processing{
  background:#fef3c7;
  color:#92400e;
}

.status-shipped{
  background:#e0e7ff;
  color:#3730a3;
}

.status-delivered{
  background:#d1fae5;
  color:#065f46;
}

.status-cancelled{
  background:#fee2e2;
  color:#991b1b;
}

.order-actions{
  display:flex;
  gap:7px;
}

.order-actions button{
  padding:8px 10px;
  font-size:12px;
}

.notification{
  position:fixed;
  top:85px;
  right:20px;
  width:min(380px,calc(100% - 40px));
  background:#fff;
  border-left:5px solid #198754;
  box-shadow:0 8px 30px rgba(0,0,0,.18);
  border-radius:10px;
  padding:17px;
  z-index:9999;
  display:none;
}

.notification.show{
  display:block;
  animation:slideIn .3s ease;
}

.notification-title{
  font-weight:800;
  margin-bottom:7px;
}

.notification-text{
  color:#555;
  font-size:14px;
  line-height:1.5;
}

.notification-close{
  position:absolute;
  right:10px;
  top:7px;
  background:none;
  padding:3px;
  font-size:18px;
}

.empty{
  text-align:center;
  color:#777;
  padding:30px;
}

.image-preview{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:10px;
}

.preview-item{
  width:90px;
  height:90px;
  border-radius:8px;
  overflow:hidden;
  border:1px solid #ddd;
}

.preview-item img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:500;
}

.modal.show{
  display:flex;
}

.modal-box{
  background:#fff;
  width:min(850px,100%);
  max-height:90vh;
  overflow:auto;
  border-radius:15px;
  padding:25px;
}

.modal-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:20px;
}

.close-btn{
  background:#eee;
  border-radius:50%;
  width:38px;
  height:38px;
  padding:0;
  font-size:20px;
}

.invoice{
  background:#fff;
}

.invoice-header{
  display:flex;
  justify-content:space-between;
  gap:20px;
  padding-bottom:20px;
  border-bottom:2px solid #111;
  margin-bottom:20px;
}

.invoice-title{
  font-size:28px;
  font-weight:800;
}

.invoice-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
  margin-bottom:25px;
}

.invoice-box{
  border:1px solid #ddd;
  padding:15px;
  border-radius:8px;
}

.invoice-box h3{
  margin-bottom:8px;
}

.invoice-items{
  width:100%;
  border-collapse:collapse;
  min-width:0;
}

.invoice-items th,
.invoice-items td{
  border:1px solid #ddd;
}

.invoice-total{
  margin-left:auto;
  width:min(350px,100%);
  margin-top:20px;
}

.total-row{
  display:flex;
  justify-content:space-between;
  padding:8px 0;
}

.total-final{
  border-top:2px solid #111;
  padding-top:12px;
  font-size:20px;
  font-weight:800;
}

.loading{
  text-align:center;
  padding:25px;
  color:#777;
}

@keyframes slideIn{
  from{
    transform:translateX(30px);
    opacity:0;
  }
  to{
    transform:translateX(0);
    opacity:1;
  }
}

@media(max-width:900px){
  .dashboard-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .products-grid{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:650px){
  header{
    align-items:flex-start;
    flex-direction:column;
  }

  .header-right{
    width:100%;
    justify-content:space-between;
  }

  .dashboard-grid{
    grid-template-columns:1fr 1fr;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .products-grid{
    grid-template-columns:1fr 1fr;
  }

  .invoice-grid{
    grid-template-columns:1fr;
  }

  .section{
    padding:15px;
  }
}

@media(max-width:430px){
  .products-grid{
    grid-template-columns:1fr;
  }

  .dashboard-grid{
    grid-template-columns:1fr 1fr;
  }

  .stat-value{
    font-size:22px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">EB MARKETIZA — OWNER</div>

  <div class="header-right">
    <div class="admin-email" id="adminEmail"></div>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </div>
</header>

<div id="paidNotification" class="notification">
  <button class="notification-close" onclick="hideNotification()">×</button>
  <div class="notification-title">💰 Payment Received</div>
  <div id="notificationText" class="notification-text"></div>
</div>

<main class="container">

  <h1>Owner Dashboard</h1>

  <div class="dashboard-grid">

    <div class="card">
      <div class="stat-title">Products</div>
      <div class="stat-value" id="productCount">0</div>
    </div>

    <div class="card">
      <div class="stat-title">Orders</div>
      <div class="stat-value" id="orderCount">0</div>
    </div>

    <div class="card">
      <div class="stat-title">Paid Orders</div>
      <div class="stat-value" id="paidOrderCount">0</div>
    </div>

    <div class="card">
      <div class="stat-title">Revenue</div>
      <div class="stat-value" id="revenueCount">0 SEK</div>
    </div>

  </div>

  <section class="section">

    <h2 id="productFormTitle">Add Product</h2>

    <form id="productForm">

      <div class="form-grid">

        <div class="form-group">
          <label>Product Name *</label>
          <input id="productName" required>
        </div>

        <div class="form-group">
          <label>Price (SEK) *</label>
          <input id="productPrice" type="number" min="0" step="0.01" required>
        </div>

        <div class="form-group">
          <label>Stock *</label>
          <input id="productStock" type="number" min="0" step="1" required>
        </div>

        <div class="form-group">
          <label>Category</label>
          <input id="productCategory">
        </div>

        <div class="form-group full">
          <label>Description</label>
          <textarea id="productDescription"></textarea>
        </div>

        <div class="form-group full">
          <label>Product Images</label>
          <input id="productImages" type="file" accept="image/*" multiple>
          <div id="imagePreview" class="image-preview"></div>
        </div>

        <div class="form-group full">
          <div style="display:flex;gap:10px;flex-wrap:wrap;">
            <button type="submit" class="primary" id="saveProductBtn">
              Add Product
            </button>

            <button type="button" class="secondary" id="cancelEditBtn" onclick="cancelEdit()" style="display:none;">
              Cancel Edit
            </button>
          </div>
        </div>

      </div>

    </form>

  </section>

  <section class="section">

    <h2>Products</h2>

    <div id="productsContainer" class="products-grid">
      <div class="loading">Loading products...</div>
    </div>

  </section>

  <section class="section">

    <div style="display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap;margin-bottom:15px;">
      <h2 style="margin:0;">Orders</h2>

      <div style="font-weight:800;">
        Paid: <span id="paidBadge">0</span>
      </div>
    </div>

    <div class="table-wrap">

      <table>

        <thead>
          <tr>
            <th>Order</th>
            <th>Customer</th>
            <th>Phone</th>
            <th>Total</th>
            <th>Payment</th>
            <th>Order Status</th>
            <th>Date</th>
            <th>Actions</th>
          </tr>
        </thead>

        <tbody id="ordersBody">
          <tr>
            <td colspan="8" class="loading">Loading orders...</td>
          </tr>
        </tbody>

      </table>

    </div>

  </section>

</main>

<div id="orderModal" class="modal">

  <div class="modal-box">

    <div class="modal-header">
      <h2>Order Details</h2>
      <button class="close-btn" onclick="closeOrderModal()">×</button>
    </div>

    <div id="orderDetails"></div>

  </div>

</div>

<script>
const SUPABASE_URL = "https://wgzjqklwxsqqykysxwho.supabase.co";

const SUPABASE_ANON_KEY =
"sb_publishable_Y4soeQaBE8hn8RazFT8soeQaBE8hn8RazFT";

const ADMIN_EMAIL = "mucyoemmy@gmail.com";

const supabase = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

let currentUser = null;
let products = [];
let orders = [];
let editingProductId = null;
let realtimeChannel = null;
let notificationTimer = null;

document.addEventListener("DOMContentLoaded", init);

async function init(){

  const {
    data:{session}
  } = await supabase.auth.getSession();

  if(!session){
    window.location.href = "login.html";
    return;
  }

  currentUser = session.user;

  const email = String(currentUser.email || "").toLowerCase();

  if(email !== ADMIN_EMAIL.toLowerCase()){
    alert("Access denied.");
    await supabase.auth.signOut();
    window.location.href = "index.html";
    return;
  }

  document.getElementById("adminEmail").textContent = currentUser.email;

  await loadProducts();
  await loadOrders();

  setupRealtime();

  document.getElementById("productImages")
    .addEventListener("change", previewImages);

  document.getElementById("productForm")
    .addEventListener("submit", saveProduct);
}

async function logout(){

  if(realtimeChannel){
    await supabase.removeChannel(realtimeChannel);
  }

  await supabase.auth.signOut();

  window.location.href = "login.html";
}

async function loadProducts(){

  const container = document.getElementById("productsContainer");

  container.innerHTML = '<div class="loading">Loading products...</div>';

  const {data,error} = await supabase
    .from("products")
    .select("*")
    .order("created_at",{ascending:false});

  if(error){

    console.error(error);

    container.innerHTML =
      '<div class="empty">Could not load products.</div>';

    return;
  }

  products = data || [];

  document.getElementById("productCount").textContent =
    products.length;

  renderProducts();
}

function renderProducts(){

  const container =
    document.getElementById("productsContainer");

  if(!products.length){

    container.innerHTML =
      '<div class="empty">No products yet.</div>';

    return;
  }

  container.innerHTML = products.map(product => {

    const image =
      product.image ||
      "https://via.placeholder.com/600x400?text=No+Image";

    return `
      <div class="product-card">

        <img
          src="${escapeHtml(image)}"
          alt="${escapeHtml(product.name || "Product")}"
        >

        <div class="product-info">

          <div class="product-name">
            ${escapeHtml(product.name || "Unnamed")}
          </div>

          <div class="product-price">
            ${formatMoney(product.price)} SEK
          </div>

          <div class="product-stock">
            Stock: ${Number(product.stock || 0)}
          </div>

          <div class="product-actions">

            <button
              class="secondary"
              onclick="editProduct('${escapeJs(product.id)}')"
            >
              Edit
            </button>

            <button
              class="danger"
              onclick="deleteProduct('${escapeJs(product.id)}')"
            >
              Delete
            </button>

          </div>

        </div>

      </div>
    `;

  }).join("");
}

function previewImages(event){

  const preview =
    document.getElementById("imagePreview");

  preview.innerHTML = "";

  const files =
    Array.from(event.target.files || []);

  files.forEach(file => {

    const reader = new FileReader();

    reader.onload = e => {

      const item =
        document.createElement("div");

      item.className = "preview-item";

      item.innerHTML =
        `<img src="${e.target.result}" alt="Preview">`;

      preview.appendChild(item);

    };

    reader.readAsDataURL(file);

  });
}

async function saveProduct(event){

  event.preventDefault();

  const button =
    document.getElementById("saveProductBtn");

  button.disabled = true;
  button.textContent = "Saving...";

  try{

    const name =
      document.getElementById("productName").value.trim();

    const price =
      Number(document.getElementById("productPrice").value);

    const stock =
      Number(document.getElementById("productStock").value);

    const category =
      document.getElementById("productCategory").value.trim();

    const description =
      document.getElementById("productDescription").value.trim();

    const files =
      Array.from(
        document.getElementById("productImages").files || []
      );

    if(!name){
      throw new Error("Product name is required.");
    }

    if(!Number.isFinite(price) || price < 0){
      throw new Error("Enter a valid price.");
    }

    if(!Number.isFinite(stock) || stock < 0){
      throw new Error("Enter a valid stock.");
    }

    let productId = editingProductId;
    let productData = null;

    if(editingProductId){

      const {data,error} = await supabase
        .from("products")
        .update({
          name,
          price,
          stock,
          category,
          description
        })
        .eq("id",editingProductId)
        .select()
        .single();

      if(error) throw error;

      productData = data;

    }else{

      const {data,error} = await supabase
        .from("products")
        .insert({
          name,
          price,
          stock,
          category,
          description
        })
        .select()
        .single();

      if(error) throw error;

      productData = data;
      productId = data.id;
    }

    if(files.length){

      const uploadedImages = [];

      for(let i=0;i<files.length;i++){

        const file = files[i];

        const extension =
          file.name.includes(".")
            ? file.name.split(".").pop().toLowerCase()
            : "jpg";

        const filePath =
          `${productId}/${Date.now()}-${i}.${extension}`;

        const {error:uploadError} =
          await supabase.storage
            .from("product-images")
            .upload(filePath,file,{
              upsert:true,
              contentType:file.type
            });

        if(uploadError) throw uploadError;

        const {data:publicData} =
          supabase.storage
            .from("product-images")
            .getPublicUrl(filePath);

        const publicUrl =
          publicData.publicUrl;

        uploadedImages.push(publicUrl);

        const {error:imageRowError} =
          await supabase
            .from("product_images")
            .insert({
              product_id: productId,
              image_url: publicUrl,
              sort_order: i
            });

        if(imageRowError) throw imageRowError;
      }

      if(uploadedImages.length){

        const {error:imageUpdateError} =
          await supabase
            .from("products")
            .update({
              image: uploadedImages[0]
            })
            .eq("id",productId);

        if(imageUpdateError) throw imageUpdateError;
      }
    }

    alert(
      editingProductId
        ? "Product updated successfully."
        : "Product added successfully."
    );

    cancelEdit();

    await loadProducts();

  }catch(error){

    console.error(error);

    alert(
      error?.message ||
      "Something went wrong while saving the product."
    );

  }finally{

    button.disabled = false;

    button.textContent =
      editingProductId
        ? "Update Product"
        : "Add Product";
  }
}

function editProduct(id){

  const product =
    products.find(
      p => String(p.id) === String(id)
    );

  if(!product) return;

  editingProductId = product.id;

  document.getElementById("productFormTitle").textContent =
    "Edit Product";

  document.getElementById("productName").value =
    product.name || "";

  document.getElementById("productPrice").value =
    product.price ?? "";

  document.getElementById("productStock").value =
    product.stock ?? "";

  document.getElementById("productCategory").value =
    product.category || "";

  document.getElementById("productDescription").value =
    product.description || "";

  document.getElementById("productImages").value = "";

  document.getElementById("imagePreview").innerHTML = "";

  document.getElementById("saveProductBtn").textContent =
    "Update Product";

  document.getElementById("cancelEditBtn").style.display =
    "inline-block";

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}

function cancelEdit(){

  editingProductId = null;

  document.getElementById("productForm").reset();

  document.getElementById("productFormTitle").textContent =
    "Add Product";

  document.getElementById("saveProductBtn").textContent =
    "Add Product";

  document.getElementById("cancelEditBtn").style.display =
    "none";

  document.getElementById("imagePreview").innerHTML = "";
}

async function deleteProduct(id){

  const product =
    products.find(
      p => String(p.id) === String(id)
    );

  if(!product) return;

  const confirmed =
    confirm(
      `Delete "${product.name}"?\n\nThis action cannot be undone.`
    );

  if(!confirmed) return;

  try{

    const {error} =
      await supabase
        .from("products")
        .delete()
        .eq("id",id);

    if(error) throw error;

    alert("Product deleted.");

    await loadProducts();

  }catch(error){

    console.error(error);

    alert(
      error?.message ||
      "Could not delete product."
    );
  }
}

async function loadOrders(){

  const body =
    document.getElementById("ordersBody");

  body.innerHTML =
    `<tr><td colspan="8" class="loading">Loading orders...</td></tr>`;

  const {data,error} =
    await supabase
      .from("orders")
      .select("*")
      .order("created_at",{ascending:false});

  if(error){

    console.error(error);

    body.innerHTML =
      `<tr><td colspan="8" class="empty">Could not load orders.</td></tr>`;

    return;
  }

  orders = data || [];

  renderOrders();
}

function renderOrders(){

  const body =
    document.getElementById("ordersBody");

  document.getElementById("orderCount").textContent =
    orders.length;

  const paidOrders =
    orders.filter(
      order =>
        String(order.payment_status || "").toLowerCase() === "paid"
    );

  document.getElementById("paidOrderCount").textContent =
    paidOrders.length;

  document.getElementById("paidBadge").textContent =
    paidOrders.length;

  const revenue =
    paidOrders.reduce(
      (sum,order) =>
        sum + Number(order.total || 0),
      0
    );

  document.getElementById("revenueCount").textContent =
    `${formatMoney(revenue)} SEK`;

  if(!orders.length){

    body.innerHTML =
      `<tr><td colspan="8" class="empty">No orders yet.</td></tr>`;

    return;
  }

  body.innerHTML = orders.map(order => {

    const payment =
      String(order.payment_status || "pending").toLowerCase();

    const orderStatus =
      String(order.order_status || "new").toLowerCase();

    return `
      <tr>

        <td>
          <strong>#${escapeHtml(order.order_number ?? "")}</strong>
        </td>

        <td>
          ${escapeHtml(order.customer_name || "—")}
          <br>
          <small>${escapeHtml(order.customer_email || "")}</small>
        </td>

        <td>
          ${escapeHtml(order.customer_phone || "—")}
        </td>

        <td>
          <strong>${formatMoney(order.total)} SEK</strong>
        </td>

        <td>
          <span class="status ${paymentClass(payment)}">
            ${escapeHtml(payment.toUpperCase())}
          </span>
        </td>

        <td>

          <select
            onchange="updateOrderStatus('${escapeJs(order.id)}',this.value)"
          >

            <option value="new" ${orderStatus==="new"?"selected":""}>
              New
            </option>

            <option value="processing" ${orderStatus==="processing"?"selected":""}>
              Processing
            </option>

            <option value="shipped" ${orderStatus==="shipped"?"selected":""}>
              Shipped
            </option>

            <option value="delivered" ${orderStatus==="delivered"?"selected":""}>
              Delivered
            </option>

            <option value="cancelled" ${orderStatus==="cancelled"?"selected":""}>
              Cancelled
            </option>

          </select>

        </td>

        <td>
          ${formatDate(order.created_at)}
        </td>

        <td>

          <div class="order-actions">

            <button
              class="secondary"
              onclick="viewOrder('${escapeJs(order.id)}')"
            >
              View
            </button>

            <button
              class="primary"
              onclick="printOrder('${escapeJs(order.id)}')"
            >
              Print
            </button>

          </div>

        </td>

      </tr>
    `;

  }).join("");
}

async function updateOrderStatus(orderId,status){

  try{

    const {error} =
      await supabase
        .from("orders")
        .update({
          order_status:status,
          updated_at:new Date().toISOString()
        })
        .eq("id",orderId);

    if(error) throw error;

  }catch(error){

    console.error(error);

    alert(
      error?.message ||
      "Could not update order status."
    );

    await loadOrders();
  }
}

function setupRealtime(){

  if(realtimeChannel){
    supabase.removeChannel(realtimeChannel);
  }

  realtimeChannel =
    supabase
      .channel("admin-orders-realtime")

      .on(
        "postgres_changes",
        {
          event:"INSERT",
          schema:"public",
          table:"orders"
        },
        payload => {

          const newOrder =
            payload.new;

          orders.unshift(newOrder);

          renderOrders();

          /*
            IMPORTANT:
            New orders are NOT notifications.
            Pending orders are NOT notifications.
          */
        }
      )

      .on(
        "postgres_changes",
        {
          event:"UPDATE",
          schema:"public",
          table:"orders"
        },
        payload => {

          const updatedOrder =
            payload.new;

          const index =
            orders.findIndex(
              order =>
                String(order.id) ===
                String(updatedOrder.id)
            );

          let oldOrder =
            index !== -1
              ? orders[index]
              : null;

          const wasPaid =
            String(oldOrder?.payment_status || "").toLowerCase()
            === "paid";

          const isPaid =
            String(updatedOrder.payment_status || "").toLowerCase()
            === "paid";

          if(index !== -1){

            orders[index] =
              updatedOrder;

          }else{

            orders.unshift(updatedOrder);
          }

          renderOrders();

          /*
            ONLY notify when payment changes
            from NOT PAID -> PAID.
          */

          if(!wasPaid && isPaid){

            showPaidOrderNotification(
              updatedOrder
            );
          }
        }
      )

      .subscribe(status => {

        console.log(
          "Orders realtime:",
          status
        );

      });
}

function showPaidOrderNotification(order){

  const notification =
    document.getElementById("paidNotification");

  const text =
    document.getElementById("notificationText");

  text.innerHTML = `
    Order <strong>#${escapeHtml(order.order_number ?? "")}</strong>
    is now <strong>PAID</strong>.<br>
    Customer: ${escapeHtml(order.customer_name || "—")}<br>
    Total: <strong>${formatMoney(order.total)} SEK</strong>
  `;

  notification.classList.add("show");

  if(notificationTimer){
    clearTimeout(notificationTimer);
  }

  notificationTimer =
    setTimeout(
      hideNotification,
      9000
    );

  /*
    Optional browser notification.
    It only works if permission has already
    been granted by the browser.
  */

  try{

    if(
      "Notification" in window &&
      Notification.permission === "granted"
    ){

      new Notification(
        "EB MARKETIZA — Payment Received",
        {
          body:
            `Order #${order.order_number} paid — ${formatMoney(order.total)} SEK`
        }
      );

    }

  }catch(error){

    console.log(
      "Browser notification unavailable."
    );
  }
}

function hideNotification(){

  document
    .getElementById("paidNotification")
    .classList.remove("show");
}

async function viewOrder(orderId){

  const order =
    orders.find(
      o => String(o.id) === String(orderId)
    );

  if(!order){

    alert("Order not found.");
    return;
  }

  const {data:items,error} =
    await supabase
      .from("order_items")
      .select("*")
      .eq("order_id",orderId)
      .order("created_at",{ascending:true});

  if(error){

    console.error(error);

    alert(
      error?.message ||
      "Could not load order items."
    );

    return;
  }

  document.getElementById("orderDetails").innerHTML =
    buildInvoice(order,items || []);

  document
    .getElementById("orderModal")
    .classList.add("show");
}

function closeOrderModal(){

  document
    .getElementById("orderModal")
    .classList.remove("show");
}

function formatMoney(value){

  return Number(value || 0)
    .toLocaleString(
      "sv-SE",
      {
        minimumFractionDigits:2,
        maximumFractionDigits:2
      }
    );
}

function formatDate(value){

  if(!value) return "—";

  const date =
    new Date(value);

  if(Number.isNaN(date.getTime())){
    return "—";
  }

  return date.toLocaleString(
    "sv-SE",
    {
      year:"numeric",
      month:"short",
      day:"numeric",
      hour:"2-digit",
      minute:"2-digit"
    }
  );
}

function paymentClass(status){

  switch(String(status).toLowerCase()){

    case "paid":
      return "status-paid";

    case "failed":
      return "status-failed";

    case "refunded":
      return "status-refunded";

    default:
      return "status-pending";
  }
}

function orderStatusClass(status){

  switch(String(status).toLowerCase()){

    case "processing":
      return "status-processing";

    case "shipped":
      return "status-shipped";

    case "delivered":
      return "status-delivered";

    case "cancelled":
      return "status-cancelled";

    default:
      return "status-new";
  }
}

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function escapeJs(value){

  return String(value ?? "")
    .replace(/\\/g,"\\\\")
    .replace(/'/g,"\\'")
    .replace(/\r/g,"\\r")
    .replace(/\n/g,"\\n");
}
