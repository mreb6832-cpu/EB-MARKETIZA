<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login | E&B MARKETIZA</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 35px;
      border-radius: 18px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.12);
    }

    .logo {
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 28px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 10px;
      margin-bottom: 18px;
      font-size: 15px;
    }

    input:focus {
      outline: none;
      border-color: #111;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #111;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #333;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .forgot-button {
      margin-top: 10px;
      background: transparent;
      color: #111;
      border: 1px solid #ddd;
      font-size: 14px;
      padding: 11px;
    }

    .forgot-button:hover {
      background: #f5f5f5;
    }

    #message {
      margin-top: 18px;
      text-align: center;
      font-size: 14px;
      line-height: 1.5;
      word-break: break-word;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #555;
      text-decoration: none;
    }

    .back:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">
      E&B MARKETIZA
    </div>

    <div class="subtitle">
      Login to your account
    </div>

    <form id="loginForm">

      <label for="email">
        Email
      </label>

      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        autocomplete="email"
        required
      >

      <label for="password">
        Password
      </label>

      <input
        type="password"
        id="password"
        placeholder="Enter your password"
        autocomplete="current-password"
        required
      >

      <button type="submit" id="loginButton">
        Login
      </button>

      <button
        type="button"
        id="forgotPasswordButton"
        class="forgot-button"
      >
        Forgot Password?
      </button>

    </form>

    <div id="message"></div>

    <a href="index.html" class="back">
      ← Back to Home
    </a>

  </div>

  <script type="module">

    import { supabase } from "./supabaseClient.js";

    const loginForm =
      document.getElementById("loginForm");

    const loginButton =
      document.getElementById("loginButton");

    const forgotPasswordButton =
      document.getElementById(
        "forgotPasswordButton"
      );

    const message =
      document.getElementById("message");


    // Check if the user is already logged in

    async function checkExistingSession() {

      try {

        const {
          data,
          error
        } = await supabase.auth.getSession();

        if (error) {
          console.error(
            "Session check error:",
            error
          );
          return;
        }

        if (data.session) {

          window.location.replace(
            "account.html"
          );

        }

      } catch (error) {

        console.error(
          "Session check error:",
          error
        );

      }

    }


    checkExistingSession();


    // Login

    loginForm.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();

        const email =
          document
            .getElementById("email")
            .value
            .trim();

        const password =
          document
            .getElementById("password")
            .value;

        message.textContent = "";

        loginButton.disabled = true;

        forgotPasswordButton.disabled = true;

        loginButton.textContent =
          "Logging in...";


        try {

          const {
            data,
            error
          } =
            await supabase.auth.signInWithPassword({
              email: email,
              password: password
            });


          if (error) {
            throw error;
          }


          if (!data.user) {
            throw new Error(
              "Login succeeded but no user was returned."
            );
          }


          const {
            data: sessionData,
            error: sessionError
          } =
            await supabase.auth.getSession();


          if (sessionError) {
            throw sessionError;
          }


          if (!sessionData.session) {
            throw new Error(
              "Login succeeded but no session was created."
            );
          }


          message.style.color = "green";

          message.textContent =
            "Login successful. Opening your account...";


          setTimeout(() => {

            window.location.replace(
              "account.html"
            );

          }, 500);


        } catch (error) {

          console.error(
            "Supabase login error:",
            error
          );

          message.style.color = "red";


          if (
            error.message ===
            "Invalid login credentials"
          ) {

            message.textContent =
              "Incorrect email or password.";

          } else {

            message.textContent =
              error.message ||
              "Login failed.";

          }

        } finally {

          loginButton.disabled = false;

          forgotPasswordButton.disabled =
            false;

          loginButton.textContent =
            "Login";

        }

      }
    );


    // Forgot password

    forgotPasswordButton.addEventListener(
      "click",
      async () => {

        const email =
          document
            .getElementById("email")
            .value
            .trim();


        if (!email) {

          message.style.color = "red";

          message.textContent =
            "Enter your email first.";

          return;

        }


        forgotPasswordButton.disabled =
          true;

        loginButton.disabled =
          true;

        forgotPasswordButton.textContent =
          "Sending...";

        message.textContent = "";


        try {

          const {
            error
          } =
            await supabase.auth
              .resetPasswordForEmail(
                email,
                {
                  redirectTo:
                    `${window.location.origin}/reset-password.html`
                }
              );


          if (error) {
            throw error;
          }


          message.style.color =
            "green";

          message.textContent =
            "Password reset email sent. Check your inbox.";


        } catch (error) {

          console.error(
            "Password reset error:",
            error
          );

          message.style.color =
            "red";

          message.textContent =
            error.message ||
            "Could not send password reset email.";

        } finally {

          forgotPasswordButton.disabled =
            false;

          loginButton.disabled =
            false;

          forgotPasswordButton.textContent =
            "Forgot Password?";

        }

      }
    );


    // Keep the user logged in.
    // No automatic sign-out is performed.

    supabase.auth.onAuthStateChange(
      (event, session) => {

        console.log(
          "Auth event:",
          event
        );

      }
    );

  </script>

</body>
</html>
