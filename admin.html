<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Dashboard | EB MARKETIZA</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #111827;
    }

    header {
      background: #111827;
      color: white;
      padding: 18px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 22px;
    }

    header a {
      color: white;
      text-decoration: none;
      background: #2563eb;
      padding: 10px 15px;
      border-radius: 8px;
    }

    .container {
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 14px;
      box-shadow: 0 5px 20px rgba(0,0,0,.06);
      margin-bottom: 25px;
    }

    h2 {
      margin-bottom: 20px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 15px;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    .full {
      grid-column: 1 / -1;
    }

    button {
      border: none;
      padding: 12px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
    }

    .add-btn {
      background: #2563eb;
      color: white;
    }

    .delete-btn {
      background: #dc2626;
      color: white;
      padding: 8px 12px;
    }

    .edit-btn {
      background: #f59e0b;
      color: white;
      padding: 8px 12px;
      margin-right: 5px;
    }

    #message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      display: none;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    .products-table {
      width: 100%;
      border-collapse: collapse;
    }

    .products-table th,
    .products-table td {
      padding: 12px;
      border-bottom: 1px solid #e5e7eb;
      text-align: left;
      vertical-align: middle;
    }

    .products-table th {
      background: #f9fafb;
    }

    .product-image {
      width: 60px;
      height: 60px;
      object-fit: cover;
      border-radius: 8px;
    }

    .empty {
      text-align: center;
      padding: 25px;
      color: #6b7280;
    }

    @media (max-width: 700px) {
      .form-grid {
        grid-template-columns: 1fr;
      }

      .full {
        grid-column: auto;
      }

      .products-table {
        font-size: 13px;
      }

      .products-table th:nth-child(3),
      .products-table td:nth-child(3) {
        display: none;
      }

      .container {
        padding: 0 12px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>EB MARKETIZA — Admin</h1>
  <a href="products.html">View Store</a>
</header>

<div class="container">

  <div class="card">
    <h2>➕ Add Product</h2>

    <form id="productForm">

      <div class="form-grid">

        <div>
          <label>Product Name</label>
          <input
            type="text"
            id="name"
            placeholder="Product name"
            required
          >
        </div>

        <div>
          <label>Price (SEK)</label>
          <input
            type="number"
            id="price"
            placeholder="100"
            min="0"
            step="0.01"
            required
          >
        </div>

        <div>
          <label>Category</label>
          <input
            type="text"
            id="category"
            placeholder="Electronics"
          >
        </div>

        <div>
          <label>Stock</label>
          <input
            type="number"
            id="stock"
            placeholder="10"
            min="0"
            value="0"
          >
        </div>

        <div class="full">
          <label>Image URL</label>
          <input
            type="url"
            id="image"
            placeholder="https://example.com/product.jpg"
          >
        </div>

        <div class="full">
          <label>Description</label>
          <textarea
            id="description"
            placeholder="Product description..."
          ></textarea>
        </div>

        <div class="full">
          <button class="add-btn" type="submit">
            Add Product
          </button>
        </div>

      </div>

    </form>

    <div id="message"></div>
  </div>


  <div class="card">

    <h2>📦 Products</h2>

    <div style="overflow-x:auto;">

      <table class="products-table">

        <thead>
          <tr>
            <th>Image</th>
            <th>Name</th>
            <th>Description</th>
            <th>Price</th>
            <th>Stock</th>
            <th>Action</th>
          </tr>
        </thead>

        <tbody id="productsTable">
          <tr>
            <td colspan="6" class="empty">
              No products yet.
            </td>
          </tr>
        </tbody>

      </table>

    </div>

  </div>

</div>


<script type="module">

  import { supabase } from "./supabaseClient.js";


  const form = document.getElementById("productForm");
  const productsTable = document.getElementById("productsTable");
  const message = document.getElementById("message");


  function showMessage(text, type) {

    message.textContent = text;
    message.className = type;
    message.style.display = "block";

    setTimeout(() => {
      message.style.display = "none";
    }, 4000);
  }


  async function loadProducts() {

    const { data, error } = await supabase
      .from("products")
      .select("*")
      .order("created_at", {
        ascending: false
      });

    if (error) {

      productsTable.innerHTML = `
        <tr>
          <td colspan="6" class="empty">
            ${error.message}
          </td>
        </tr>
      `;

      return;
    }


    if (!data || data.length === 0) {

      productsTable.innerHTML = `
        <tr>
          <td colspan="6" class="empty">
            No products yet.
          </td>
        </tr>
      `;

      return;
    }


    productsTable.innerHTML = data.map(product => {

      const image = product.image
        ? `<img src="${product.image}" class="product-image">`
        : "No image";

      return `
        <tr>

          <td>${image}</td>

          <td>${escapeHtml(product.name || "")}</td>

          <td>${escapeHtml(product.description || "")}</td>

          <td>${Number(product.price || 0).toFixed(2)} SEK</td>

          <td>${product.stock ?? 0}</td>

          <td>
            <button
              class="delete-btn"
              data-id="${product.id}">
              Delete
            </button>
          </td>

        </tr>
      `;

    }).join("");


    document.querySelectorAll(".delete-btn").forEach(button => {

      button.addEventListener("click", () => {

        deleteProduct(button.dataset.id);

      });

    });

  }


  async function deleteProduct(id) {

    const confirmed = confirm(
      "Delete this product?"
    );

    if (!confirmed) return;


    const { error } = await supabase
      .from("products")
      .delete()
      .eq("id", id);


    if (error) {

      showMessage(
        "Could not delete product: " + error.message,
        "error"
      );

      return;
    }


    showMessage(
      "Product deleted successfully.",
      "success"
    );

    loadProducts();

  }


  form.addEventListener("submit", async (event) => {

    event.preventDefault();


    const name = document.getElementById("name").value.trim();
    const price = Number(document.getElementById("price").value);
    const category = document.getElementById("category").value.trim();
    const stock = Number(document.getElementById("stock").value || 0);
    const image = document.getElementById("image").value.trim();
    const description = document.getElementById("description").value.trim();


    if (!name) {

      showMessage(
        "Product name is required.",
        "error"
      );

      return;
    }


    if (Number.isNaN(price) || price < 0) {

      showMessage(
        "Enter a valid price.",
        "error"
      );

      return;
    }


    const { error } = await supabase
      .from("products")
      .insert({
        name,
        description,
        price,
        category,
        stock,
        image
      });


    if (error) {

      showMessage(
        "Could not add product: " + error.message,
        "error"
      );

      return;
    }


    showMessage(
      "Product added successfully!",
      "success"
    );


    form.reset();

    document.getElementById("stock").value = 0;

    loadProducts();

  });


  function escapeHtml(value) {

    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  }


  loadProducts();

</script>

</body>
</html>
