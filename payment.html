<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Payment | E&B MARKETIZA</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #111;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 520px;
      margin: 40px auto;
      padding: 20px;
    }

    .payment-box {
      background: #fff;
      border-radius: 16px;
      padding: 25px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    .summary {
      background: #f7f7f7;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 22px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      margin: 8px 0;
    }

    .total {
      font-size: 20px;
      font-weight: bold;
      border-top: 1px solid #ddd;
      padding-top: 12px;
      margin-top: 12px;
    }

    .method {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 14px;
      margin: 10px 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .method:hover {
      background: #f8f8f8;
    }

    .method input {
      width: 18px;
      height: 18px;
    }

    .pay-btn {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 15px;
      margin-top: 20px;
      background: #111;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .pay-btn:hover {
      background: #333;
    }

    .pay-btn:disabled {
      background: #999;
      cursor: not-allowed;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 18px;
      color: #111;
      text-decoration: none;
    }

    .message {
      margin-top: 15px;
      text-align: center;
      color: #d00;
      font-size: 14px;
    }

    .loading {
      text-align: center;
      padding: 20px;
      color: #666;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="payment-box">

    <h1>E&B MARKETIZA</h1>

    <p class="subtitle">
      Secure Checkout
    </p>

    <div id="loading" class="loading">
      Loading your cart...
    </div>

    <div id="checkoutArea" style="display:none;">

      <div class="summary">

        <div class="summary-row">
          <span>Items</span>
          <strong id="itemsCount">0</strong>
        </div>

        <div class="summary-row">
          <span>Delivery</span>
          <strong>FREE</strong>
        </div>

        <div class="summary-row total">
          <span>Total</span>
          <strong id="totalPrice">0 SEK</strong>
        </div>

      </div>


      <h3>Select payment method</h3>


      <!-- STRIPE -->

      <label class="method">

        <input
          type="radio"
          name="paymentMethod"
          value="stripe"
          checked
        >

        <span>
          💳 Card / Stripe
        </span>

      </label>


      <!-- PAYPAL -->

      <label class="method">

        <input
          type="radio"
          name="paymentMethod"
          value="paypal"
        >

        <span>
          🅿️ PayPal
        </span>

      </label>


      <button
        id="payButton"
        class="pay-btn"
      >
        Pay by Card
      </button>


      <div
        id="message"
        class="message"
      ></div>


      <a
        href="cart.html"
        class="back"
      >
        ← Back to Cart
      </a>

    </div>

  </div>

</div>


<script type="module">

import { supabase } from "./supabaseClient.js";


const loading =
  document.getElementById("loading");

const checkoutArea =
  document.getElementById("checkoutArea");

const payButton =
  document.getElementById("payButton");

const message =
  document.getElementById("message");

const itemsCount =
  document.getElementById("itemsCount");

const totalPrice =
  document.getElementById("totalPrice");


let cartItems = [];

let total = 0;


/* =========================
   LOAD CART
========================= */

async function loadCart() {

  try {

    const {
      data: sessionData,
      error: sessionError
    } = await supabase.auth.getSession();


    if (sessionError) {
      throw sessionError;
    }


    const session =
      sessionData?.session;


    if (!session) {

      window.location.href =
        "login.html";

      return;
    }


    /* GET CART */

    const {
      data: cartData,
      error: cartError
    } = await supabase
      .from("cart_items")
      .select(
        "id, user_id, product_id, quantity"
      )
      .eq(
        "user_id",
        session.user.id
      );


    if (cartError) {
      throw cartError;
    }


    if (
      !cartData ||
      cartData.length === 0
    ) {

      showMessage(
        "Your cart is empty."
      );

      return;
    }


    /* GET PRODUCT IDS */

    const productIds =
      cartData.map(
        item =>
          item.product_id
      );


    /* GET PRODUCTS */

    const {
      data: products,
      error: productsError
    } = await supabase
      .from("products")
      .select(
        "id, name, price, stock"
      )
      .in(
        "id",
        productIds
      );


    if (productsError) {
      throw productsError;
    }


    /* COMBINE */

    cartItems =
      cartData
        .map(item => {

          const product =
            products.find(
              p =>
                Number(p.id) ===
                Number(item.product_id)
            );


          if (!product) {
            return null;
          }


          return {

            id:
              item.id,

            product_id:
              item.product_id,

            quantity:
              Number(item.quantity),

            product:
              product

          };

        })
        .filter(Boolean);


    if (
      cartItems.length === 0
    ) {

      showMessage(
        "Your cart is empty."
      );

      return;
    }


    /* CALCULATE TOTAL */

    total =
      cartItems.reduce(
        (sum, item) => {

          return sum +
            (
              Number(
                item.product.price
              ) *
              Number(
                item.quantity
              )
            );

        },
        0
      );


    const count =
      cartItems.reduce(
        (sum, item) =>
          sum +
          Number(item.quantity),
        0
      );


    itemsCount.textContent =
      count;


    totalPrice.textContent =
      formatSEK(total);


    loading.style.display =
      "none";

    checkoutArea.style.display =
      "block";

  } catch (error) {

    console.error(
      "Checkout error:",
      error
    );


    showMessage(
      "Could not load your cart."
    );

  }

}


/* =========================
   CHANGE PAYMENT METHOD
========================= */

document
  .querySelectorAll(
    'input[name="paymentMethod"]'
  )
  .forEach(
    radio => {

      radio.addEventListener(
        "change",
        () => {

          if (
            radio.value ===
            "paypal"
          ) {

            payButton.textContent =
              "Pay with PayPal";

          } else {

            payButton.textContent =
              "Pay by Card";

          }

        }
      );

    }
  );


/* =========================
   PAYMENT
========================= */

payButton.addEventListener(
  "click",
  async () => {

    if (
      cartItems.length === 0
    ) {

      showMessage(
        "Your cart is empty."
      );

      return;
    }


    const selected =
      document.querySelector(
        'input[name="paymentMethod"]:checked'
      );


    if (!selected) {

      showMessage(
        "Please select a payment method."
      );

      return;
    }


    const method =
      selected.value;


    payButton.disabled =
      true;

    message.textContent =
      "";


    try {


      /* =====================
         STRIPE
      ===================== */

      if (
        method === "stripe"
      ) {

        payButton.textContent =
          "Connecting to Stripe...";


        const response =
          await fetch(
            "/api/create-checkout-session",
            {

              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({

                  items:
                    cartItems.map(
                      item => ({

                        name:
                          item.product.name,

                        price:
                          Number(
                            item.product.price
                          ),

                        quantity:
                          Number(
                            item.quantity
                          )

                      })
                    )

                })

            }
          );


        const data =
          await response.json();


        if (!response.ok) {

          throw new Error(
            data.error ||
            "Stripe payment failed."
          );

        }


        if (!data.url) {

          throw new Error(
            "Stripe Checkout URL was not returned."
          );

        }


        window.location.href =
          data.url;

        return;

      }


      /* =====================
         PAYPAL
      ===================== */

      if (
        method === "paypal"
      ) {

        payButton.textContent =
          "Connecting to PayPal...";


        const response =
          await fetch(
            "/api/paypal-create-order",
            {

              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({

                  items:
                    cartItems.map(
                      item => ({

                        product_id:
                          item.product_id,

                        name:
                          item.product.name,

                        price:
                          Number(
                            item.product.price
                          ),

                        quantity:
                          Number(
                            item.quantity
                          )

                      })
                    )

                })

            }
          );


        const data =
          await response.json();


        if (!response.ok) {

          throw new Error(
            data.error ||
            "PayPal order could not be created."
          );

        }


        if (
          !data.approvalUrl
        ) {

          throw new Error(
            "PayPal approval URL was not returned."
          );

        }


        window.location.href =
          data.approvalUrl;

      }

    } catch (error) {

      console.error(
        "Payment error:",
        error
      );


      message.textContent =
        error.message ||
        "Unable to start payment.";


      payButton.disabled =
        false;


      payButton.textContent =
        method === "paypal"
          ? "Pay with PayPal"
          : "Pay by Card";

    }

  }
);


/* =========================
   HELPERS
========================= */

function formatSEK(value) {

  return new Intl.NumberFormat(
    "sv-SE",
    {
      style: "currency",
      currency: "SEK"
    }
  ).format(
    Number(value || 0)
  );

}


function showMessage(text) {

  loading.style.display =
    "none";

  checkoutArea.style.display =
    "block";

  message.textContent =
    text;

}


/* =========================
   START
========================= */

loadCart();

</script>

</body>
</html>
