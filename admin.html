<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Dashboard | EB MARKETIZA</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      color: #111827;
    }

    header {
      background: #111827;
      color: white;
      padding: 16px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header h1 {
      font-size: 21px;
    }

    .header-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .header-buttons a,
    .header-buttons button {
      text-decoration: none;
      color: white;
      background: #2563eb;
      border: none;
      padding: 9px 13px;
      border-radius: 8px;
      cursor: pointer;
    }

    .logout-btn {
      background: #dc2626 !important;
    }

    .container {
      width: 100%;
      max-width: 1200px;
      margin: 30px auto;
      padding: 0 18px;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 5px 20px rgba(0,0,0,.06);
    }

    .card h2 {
      margin-bottom: 20px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    .full {
      grid-column: 1 / -1;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #2563eb;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    input[type="file"] {
      background: white;
    }

    .main-btn {
      background: #2563eb;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .main-btn:hover {
      background: #1d4ed8;
    }

    .main-btn:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .cancel-btn {
      background: #6b7280;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      cursor: pointer;
      display: none;
    }

    .form-buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    #message {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    .info {
      background: #dbeafe;
      color: #1e40af;
    }

    #imagePreview {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 12px;
      margin-top: 15px;
    }

    .preview-card {
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      overflow: hidden;
      background: #f9fafb;
    }

    .preview-card img {
      width: 100%;
      height: 125px;
      object-fit: cover;
      display: block;
    }

    .preview-label {
      padding: 8px;
      text-align: center;
      font-size: 13px;
      color: #4b5563;
    }

    .products-wrapper {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 850px;
    }

    th,
    td {
      padding: 12px;
      border-bottom: 1px solid #e5e7eb;
      text-align: left;
      vertical-align: middle;
    }

    th {
      background: #f9fafb;
    }

    .table-image {
      width: 65px;
      height: 65px;
      object-fit: cover;
      border-radius: 8px;
    }

    .action-buttons {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .edit-btn {
      background: #f59e0b;
      color: white;
      border: none;
      padding: 8px 11px;
      border-radius: 7px;
      cursor: pointer;
    }

    .delete-btn {
      background: #dc2626;
      color: white;
      border: none;
      padding: 8px 11px;
      border-radius: 7px;
      cursor: pointer;
    }

    .refresh-btn {
      background: #111827;
      color: white;
      border: none;
      padding: 9px 14px;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 15px;
    }

    .empty {
      text-align: center;
      color: #6b7280;
      padding: 30px;
    }

    .photo-count {
      display: inline-block;
      background: #eff6ff;
      color: #1d4ed8;
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
    }

    .admin-email {
      margin-bottom: 20px;
      padding: 12px;
      background: #f3f4f6;
      border-radius: 8px;
      color: #374151;
    }

    @media (max-width: 700px) {
      .form-grid {
        grid-template-columns: 1fr;
      }

      .full {
        grid-column: auto;
      }

      header {
        align-items: flex-start;
        flex-direction: column;
      }

      .container {
        padding: 0 12px;
        margin-top: 18px;
      }

      .card {
        padding: 18px;
      }
    }
  </style>
</head>

<body>

<header>

  <h1>EB MARKETIZA — Admin</h1>

  <div class="header-buttons">

    <a href="index.html">
      Home
    </a>

    <a href="products.html">
      Store
    </a>

    <button
      id="logoutButton"
      class="logout-btn"
      type="button"
    >
      Logout
    </button>

  </div>

</header>


<div class="container">

  <!-- ADMIN INFO -->

  <div class="card">

    <div class="admin-email">
      Logged in as:
      <strong id="adminEmail">Checking...</strong>
    </div>

  </div>


  <!-- PRODUCT FORM -->

  <div class="card">

    <h2 id="formTitle">
      ➕ Add Product
    </h2>

    <form id="productForm">

      <div class="form-grid">

        <div>

          <label for="name">
            Product Name
          </label>

          <input
            id="name"
            type="text"
            placeholder="Product name"
            required
          >

        </div>


        <div>

          <label for="price">
            Price (SEK)
          </label>

          <input
            id="price"
            type="number"
            min="0"
            step="0.01"
            placeholder="99.90"
            required
          >

        </div>


        <div>

          <label for="category">
            Category
          </label>

          <input
            id="category"
            type="text"
            placeholder="Electronics"
          >

        </div>


        <div>

          <label for="stock">
            Stock
          </label>

          <input
            id="stock"
            type="number"
            min="0"
            value="0"
            placeholder="10"
          >

        </div>


        <!-- MULTIPLE PHOTOS -->

        <div class="full">

          <label for="productImages">
            Product Photos
          </label>

          <input
            id="productImages"
            type="file"
            accept="image/*"
            multiple
          >

          <p style="
            margin-top:8px;
            color:#6b7280;
            font-size:14px;
          ">
            Select one or multiple photos.
          </p>

          <div id="imagePreview"></div>

        </div>


        <div class="full">

          <label for="description">
            Description
          </label>

          <textarea
            id="description"
            placeholder="Describe the product..."
          ></textarea>

        </div>


        <div class="full form-buttons">

          <button
            id="saveButton"
            class="main-btn"
            type="submit"
          >
            ➕ Add Product
          </button>

          <button
            id="cancelButton"
            class="cancel-btn"
            type="button"
          >
            Cancel Edit
          </button>

        </div>

      </div>

    </form>


    <div id="message"></div>

  </div>


  <!-- PRODUCT LIST -->

  <div class="card">

    <h2>
      📦 Products
    </h2>

    <button
      id="refreshButton"
      class="refresh-btn"
      type="button"
    >
      🔄 Refresh
    </button>

    <div class="products-wrapper">

      <table>

        <thead>

          <tr>

            <th>
              Image
            </th>

            <th>
              Name
            </th>

            <th>
              Category
            </th>

            <th>
              Price
            </th>

            <th>
              Stock
            </th>

            <th>
              Photos
            </th>

            <th>
              Actions
            </th>

          </tr>

        </thead>

        <tbody id="productsTable">

          <tr>

            <td
              colspan="7"
              class="empty"
            >
              No products yet.
            </td>

          </tr>

        </tbody>

      </table>

    </div>

  </div>

</div>


<script type="module">

  import { supabase }
    from "./supabaseClient.js";


  /*
   * ADMIN EMAIL
   */

  const ADMIN_EMAIL =
    "mucyoemmy539@gmail.com";


  /*
   * ELEMENTS
   */

  const form =
    document.getElementById("productForm");

  const nameInput =
    document.getElementById("name");

  const priceInput =
    document.getElementById("price");

  const categoryInput =
    document.getElementById("category");

  const stockInput =
    document.getElementById("stock");

  const descriptionInput =
    document.getElementById("description");

  const imageInput =
    document.getElementById("productImages");

  const imagePreview =
    document.getElementById("imagePreview");

  const productsTable =
    document.getElementById("productsTable");

  const message =
    document.getElementById("message");

  const saveButton =
    document.getElementById("saveButton");

  const cancelButton =
    document.getElementById("cancelButton");

  const formTitle =
    document.getElementById("formTitle");

  const adminEmail =
    document.getElementById("adminEmail");


  /*
   * EDIT MODE
   */

  let editingProductId = null;


  /*
   * MESSAGE
   */

  function showMessage(
    text,
    type
  ) {

    message.textContent = text;

    message.className = type;

    message.style.display = "block";

  }


  function hideMessage() {

    message.style.display = "none";

  }


  /*
   * AUTH CHECK
   */

  async function checkAdmin() {

    const {
      data: {
        user
      }
    } =
      await supabase.auth.getUser();


    if (!user) {

      window.location.href =
        "login.html";

      return false;

    }


    adminEmail.textContent =
      user.email || "";


    if (
      user.email?.toLowerCase() !==
      ADMIN_EMAIL.toLowerCase()
    ) {

      document.body.innerHTML = `

        <div style="
          min-height:100vh;
          display:flex;
          align-items:center;
          justify-content:center;
          padding:20px;
          background:#f4f6f9;
          font-family:Arial;
        ">

          <div style="
            background:white;
            padding:35px;
            border-radius:15px;
            text-align:center;
            max-width:450px;
            width:100%;
            box-shadow:0 5px 25px rgba(0,0,0,.1);
          ">

            <h2>
              Access Denied
            </h2>

            <p style="
              margin:15px 0;
              color:#6b7280;
            ">
              You are not authorized to access
              the admin dashboard.
            </p>

            <a
              href="index.html"
              style="
                display:inline-block;
                background:#2563eb;
                color:white;
                text-decoration:none;
                padding:11px 18px;
                border-radius:8px;
              "
            >
              Go Home
            </a>

          </div>

        </div>

      `;

      return false;

    }


    return true;

  }


  /*
   * IMAGE PREVIEW
   */

  imageInput.addEventListener(
    "change",
    () => {

      imagePreview.innerHTML = "";

      const files =
        Array.from(
          imageInput.files
        );


      files.forEach(
        (file, index) => {

          const reader =
            new FileReader();


          reader.onload =
            event => {

              const div =
                document.createElement(
                  "div"
                );

              div.className =
                "preview-card";


              div.innerHTML = `

                <img
                  src="${event.target.result}"
                  alt="Product photo"
                >

                <div class="preview-label">
                  Photo ${index + 1}
                </div>

              `;


              imagePreview.appendChild(
                div
              );

            };


          reader.readAsDataURL(file);

        }
      );

    }
  );


  /*
   * UPLOAD IMAGE
   */

  async function uploadImage(
    file,
    productId,
    index
  ) {

    const extension =
      file.name
        .split(".")
        .pop()
        .toLowerCase();


    const filePath =
      `${productId}/${Date.now()}-${index}-${crypto.randomUUID()}.${extension}`;


    const {
      error
    } =
      await supabase.storage
        .from("product-images")
        .upload(
          filePath,
          file,
          {
            cacheControl: "3600",
            upsert: false
          }
        );


    if (error) {

      throw error;

    }


    const {
      data
    } =
      supabase.storage
        .from("product-images")
        .getPublicUrl(
          filePath
        );


    return data.publicUrl;

  }


  /*
   * ADD PRODUCT
   */

  async function addProduct() {

    const name =
      nameInput.value.trim();

    const price =
      Number(
        priceInput.value
      );

    const category =
      categoryInput.value.trim();

    const stock =
      Number(
        stockInput.value || 0
      );

    const description =
      descriptionInput.value.trim();

    const files =
      Array.from(
        imageInput.files
      );


    if (!name) {

      throw new Error(
        "Product name is required."
      );

    }


    if (
      Number.isNaN(price) ||
      price < 0
    ) {

      throw new Error(
        "Enter a valid price."
      );

    }


    /*
     * CREATE PRODUCT FIRST
     */

    const {
      data: product,
      error
    } =
      await supabase
        .from("products")
        .insert({

          name,

          description,

          price,

          category,

          stock,

          image: null

        })
        .select()
        .single();


    if (error) {

      throw error;

    }


    const uploadedUrls = [];


    /*
     * UPLOAD ALL PHOTOS
     */

    for (
      let i = 0;
      i < files.length;
      i++
    ) {

      saveButton.textContent =
        `Uploading ${i + 1}/${files.length}...`;


      const url =
        await uploadImage(
          files[i],
          product.id,
          i
        );


      uploadedUrls.push(url);

    }


    /*
     * SAVE IMAGE RECORDS
     */

    if (
      uploadedUrls.length > 0
    ) {

      const rows =
        uploadedUrls.map(
          (url, index) => ({

            product_id:
              product.id,

            image_url:
              url,

            sort_order:
              index

          })
        );


      const {
        error: imageError
      } =
        await supabase
          .from("product_images")
          .insert(rows);


      if (imageError) {

        throw imageError;

      }


      /*
       * FIRST IMAGE
       * FOR PRODUCT CARD
       */

      const {
        error: updateError
      } =
        await supabase
          .from("products")
          .update({
            image:
              uploadedUrls[0]
          })
          .eq(
            "id",
            product.id
          );


      if (updateError) {

        throw updateError;

      }

    }


    showMessage(
      `Product added successfully! ${uploadedUrls.length} photo(s) uploaded.`,
      "success"
    );


    resetForm();

    await loadProducts();

  }


  /*
   * EDIT PRODUCT
   */

  async function updateProduct() {

    const name =
      nameInput.value.trim();

    const price =
      Number(
        priceInput.value
      );

    const category =
      categoryInput.value.trim();

    const stock =
      Number(
        stockInput.value || 0
      );

    const description =
      descriptionInput.value.trim();

    const files =
      Array.from(
        imageInput.files
      );


    if (!name) {

      throw new Error(
        "Product name is required."
      );

    }


    if (
      Number.isNaN(price) ||
      price < 0
    ) {

      throw new Error(
        "Enter a valid price."
      );

    }


    /*
     * UPDATE PRODUCT
     */

    const {
      error
    } =
      await supabase
        .from("products")
        .update({

          name,

          description,

          price,

          category,

          stock

        })
        .eq(
          "id",
          editingProductId
        );


    if (error) {

      throw error;

    }


    /*
     * OPTIONAL NEW PHOTOS
     */

    if (files.length > 0) {

      const uploadedUrls = [];


      for (
        let i = 0;
        i < files.length;
        i++
      ) {

        saveButton.textContent =
          `Uploading ${i + 1}/${files.length}...`;


        const url =
          await uploadImage(
            files[i],
            editingProductId,
            i
          );


        uploadedUrls.push(url);

      }


      const rows =
        uploadedUrls.map(
          (url, index) => ({

            product_id:
              editingProductId,

            image_url:
              url,

            sort_order:
              Date.now() + index

          })
        );


      const {
        error: imageError
      } =
        await supabase
          .from("product_images")
          .insert(rows);


      if (imageError) {

        throw imageError;

      }


      /*
       * IF PRODUCT HAS NO MAIN IMAGE,
       * USE NEW FIRST IMAGE
       */

      const {
        data: currentProduct
      } =
        await supabase
          .from("products")
          .select("image")
          .eq(
            "id",
            editingProductId
          )
          .single();


      if (
        !currentProduct?.image &&
        uploadedUrls[0]
      ) {

        await supabase
          .from("products")
          .update({
            image:
              uploadedUrls[0]
          })
          .eq(
            "id",
            editingProductId
          );

      }

    }


    showMessage(
      "Product updated successfully!",
      "success"
    );


    resetForm();

    await loadProducts();

  }


  /*
   * FORM SUBMIT
   */

  form.addEventListener(
    "submit",
    async event => {

      event.preventDefault();

      hideMessage();

      saveButton.disabled = true;


      try {

        if (
          editingProductId
        ) {

          await updateProduct();

        } else {

          await addProduct();

        }

      } catch (error) {

        console.error(error);

        showMessage(
          "Error: " +
          error.message,
          "error"
        );

      } finally {

        saveButton.disabled = false;

        saveButton.textContent =
          editingProductId
            ? "💾 Update Product"
            : "➕ Add Product";

      }

    }
  );


  /*
   * LOAD PRODUCTS
   */

  async function loadProducts() {

    productsTable.innerHTML = `

      <tr>
        <td
          colspan="7"
          class="empty"
        >
          Loading products...
        </td>
      </tr>

    `;


    const {
      data,
      error
    } =
      await supabase
        .from("products")
        .select("*")
        .order(
          "created_at",
          {
            ascending: false
          }
        );


    if (error) {

      productsTable.innerHTML = `

        <tr>
          <td
            colspan="7"
            class="empty"
          >
            ${escapeHtml(
              error.message
            )}
          </td>
        </tr>

      `;

      return;

    }


    if (
      !data ||
      data.length === 0
    ) {

      productsTable.innerHTML = `

        <tr>
          <td
            colspan="7"
            class="empty"
          >
            No products yet.
          </td>
        </tr>

      `;

      return;

    }


    productsTable.innerHTML = "";


    for (
      const product of data
    ) {

      const {
        count
      } =
        await supabase
          .from("product_images")
          .select(
            "id",
            {
              count: "exact",
              head: true
            }
          )
          .eq(
            "product_id",
            product.id
          );


      const row =
        document.createElement(
          "tr"
        );


      row.innerHTML = `

        <td>

          ${
            product.image
              ? `
                <img
                  src="${escapeHtml(
                    product.image
                  )}"
                  class="table-image"
                  alt="Product"
                >
              `
              : "No image"
          }

        </td>


        <td>
          ${escapeHtml(
            product.name || ""
          )}
        </td>


        <td>
          ${escapeHtml(
            product.category || "-"
          )}
        </td>


        <td>
          ${Number(
            product.price || 0
          ).toFixed(2)}
          SEK
        </td>


        <td>
          ${product.stock ?? 0}
        </td>


        <td>

          <span class="photo-count">
            ${count || 0} photo(s)
          </span>

        </td>


        <td>

          <div class="action-buttons">

            <button
              class="edit-btn"
              data-edit="${product.id}"
            >
              Edit
            </button>


            <button
              class="delete-btn"
              data-delete="${product.id}"
            >
              Delete
            </button>

          </div>

        </td>

      `;


      productsTable.appendChild(
        row
      );

    }


    /*
     * EDIT BUTTONS
     */

    document
      .querySelectorAll(
        "[data-edit]"
      )
      .forEach(button => {

        button.addEventListener(
          "click",
          () => {

            startEdit(
              button.dataset.edit
            );

          }
        );

      });


    /*
     * DELETE BUTTONS
     */

    document
      .querySelectorAll(
        "[data-delete]"
      )
      .forEach(button => {

        button.addEventListener(
          "click",
          () => {

            deleteProduct(
              button.dataset.delete
            );

          }
        );

      });

  }


  /*
   * START EDIT
   */

  async function startEdit(id) {

    const {
      data,
      error
    } =
      await supabase
        .from("products")
        .select("*")
        .eq(
          "id",
          id
        )
        .single();


    if (error) {

      showMessage(
        error.message,
        "error"
      );

      return;

    }


    editingProductId =
      id;


    nameInput.value =
      data.name || "";

    priceInput.value =
      data.price || "";

    categoryInput.value =
      data.category || "";

    stockInput.value =
      data.stock || 0;

    descriptionInput.value =
      data.description || "";


    formTitle.textContent =
      "✏️ Edit Product";


    saveButton.textContent =
      "💾 Update Product";


    cancelButton.style.display =
      "block";


    imageInput.value = "";

    imagePreview.innerHTML = "";


    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

  }


  /*
   * CANCEL EDIT
   */

  cancelButton.addEventListener(
    "click",
    () => {

      resetForm();

    }
  );


  /*
   * RESET FORM
   */

  function resetForm() {

    editingProductId = null;

    form.reset();

    stockInput.value = 0;

    imagePreview.innerHTML = "";

    formTitle.textContent =
      "➕ Add Product";

    saveButton.textContent =
      "➕ Add Product";

    cancelButton.style.display =
      "none";

  }


  /*
   * DELETE PRODUCT
   */

  async function deleteProduct(id) {

    const confirmed =
      confirm(
        "Are you sure you want to delete this product?"
      );


    if (!confirmed) {

      return;

    }


    try {

      /*
       * GET IMAGE RECORDS
       */

      const {
        data: images,
        error: imageError
      } =
        await supabase
          .from("product_images")
          .select("image_url")
          .eq(
            "product_id",
            id
          );


      if (imageError) {

        throw imageError;

      }


      /*
       * DELETE STORAGE FILES
       */

      if (
        images &&
        images.length > 0
      ) {

        const paths =
          images
            .map(item => {

              try {

                const url =
                  new URL(
                    item.image_url
                  );


                const marker =
                  "/product-images/";


                const position =
                  url.pathname.indexOf(
                    marker
                  );


                if (
                  position === -1
                ) {

                  return null;

                }


                return decodeURIComponent(
                  url.pathname.substring(
                    position +
                    marker.length
                  )
                );

              } catch {

                return null;

              }

            })
            .filter(Boolean);


        if (
          paths.length > 0
        ) {

          await supabase.storage
            .from("product-images")
            .remove(paths);

        }

      }


      /*
       * DELETE PRODUCT
       *
       * product_images rows
       * are deleted automatically
       * because of ON DELETE CASCADE.
       */

      const {
        error
      } =
        await supabase
          .from("products")
          .delete()
          .eq(
            "id",
            id
          );


      if (error) {

        throw error;

      }


      showMessage(
        "Product deleted successfully.",
        "success"
      );


      await loadProducts();

    } catch (error) {

      showMessage(
        "Could not delete product: " +
        error.message,
        "error"
      );

    }

  }


  /*
   * REFRESH
   */

  document
    .getElementById(
      "refreshButton"
    )
    .addEventListener(
      "click",
      loadProducts
    );


  /*
   * LOGOUT
   */

  document
    .getElementById(
      "logoutButton"
    )
    .addEventListener(
      "click",
      async () => {

        await supabase.auth.signOut();

        window.location.href =
          "login.html";

      }
    );


  /*
   * ESCAPE HTML
   */

  function escapeHtml(value) {

    return String(value)

      .replaceAll(
        "&",
        "&amp;"
      )

      .replaceAll(
        "<",
        "&lt;"
      )

      .replaceAll(
        ">",
        "&gt;"
      )

      .replaceAll(
        '"',
        "&quot;"
      )

      .replaceAll(
        "'",
        "&#039;"
      );

  }


  /*
   * START ADMIN
   */

  const allowed =
    await checkAdmin();


  if (allowed) {

    await loadProducts();

  }

</script>
